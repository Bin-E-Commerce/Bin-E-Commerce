  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_DB: bin_inventory
  #     KAFKA_BROKERS: kafka:9092
  #   healthcheck:
  #     test: ["CMD", "wget", "-qO-", "http://localhost:3005/api/health"]
