# ============================================================================
# Khởi động theo thứ tự:
#   1. docker compose --env-file infra/docker/.env --env-file .env -f infra/docker/docker-compose.infra.yml up -d
#   2. docker compose --env-file .env up -d --build
#
# Root .env file chứa các biến môi trường chung cho tất cả service
# ============================================================================

# THÀNH PHẦN THAM GIA
#
# Hạ tầng dùng chung:
#   PostgreSQL, MongoDB, Redis, Qdrant   | managed cloud, lấy từ .env
#   Kafka                                | chạy local trong infra compose
#   Keycloak                             | chạy local, dùng PostgreSQL cloud
#   Prometheus/Grafana/Kafka UI          | observability local
#
# Application services trong compose này:
#   Service               | Container port | Host port | Chức năng
#   API Gateway           | 3000           | 3000      | cổng vào API
#   Auth Service          | 3001           | nội bộ    | xác thực người dùng
#   Catalog Service       | 3003           | nội bộ    | read model catalog
#   Cart Service          | 3003           | nội bộ    | giỏ hàng
#   Media Service         | 3004           | nội bộ    | upload và CDN
#   Notification Service  | 3005           | nội bộ    | email/thông báo
#   Recommendation Svc    | 3006           | nội bộ    | candidate và ranking
#   Seller Service        | 3007           | nội bộ    | shop nội bộ
#   Product Service       | 3008           | nội bộ    | sản phẩm
#   AI Service            | 3009           | nội bộ    | AI và LightGBM
#   Order Service         | 3011           | nội bộ    | đơn hàng
#   Shipping Service      | 3012           | 3012      | vận chuyển/GHN
#   AI Image Worker       | không có HTTP  | nội bộ    | xử lý tối ưu ảnh nền
#   AI Embedding Worker   | không có HTTP  | không có  | xử lý background qua Kafka
#   AI Outbox Relay       | không có HTTP  | nội bộ    | đẩy outbox sang Kafka
#   Nginx                 | 80/443         | 80/443    | reverse proxy public
#
# Chỉ API Gateway, Shipping Service và Nginx publish port ra host; service còn
# lại chỉ giao tiếp qua Docker network bằng tên service.

# Tên project tạo prefix nhất quán cho container và resource do Compose quản lý.
name: bin-ecommerce-app

networks:
  bin_infra_net:
    external: true
  bin_app_net:
    driver: bridge

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - bin_infra_net
    - bin_app_net
  deploy:
    resources:
      limits:
        memory: 150m
      reservations:
        memory: 64m

services:
  # --------------------------------------------------------------------------
  # 01. Điểm vào HTTP
  # --------------------------------------------------------------------------
  # Service: API Gateway
  # Port: container 3000 -> host 3000
  # Vai trò: điểm vào HTTP duy nhất cho frontend và client bên ngoài.
  # Kết nối chính: Auth, Product, Catalog, Cart, Order, Recommendation, Shipping.
  api-gateway:
    container_name: bin-ecommerce-app-api-gateway
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: bin-ecommerce/api-gateway:local
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KEYCLOAK_REALM: bin-ecommerce
      AUTH_SERVICE_URL: http://auth-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3003
      MEDIA_SERVICE_URL: http://media-service:3004
      PRODUCT_SERVICE_URL: http://product-service:3008
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:3006
      CART_SERVICE_URL: http://cart-service:3003
      ORDER_SERVICE_URL: http://order-service:3011
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_DB: ${REDIS_DB:-0}
      NOTIFICATION_SERVICE_URL: http://notification-service:3005
      SHIPPING_SERVICE_URL: http://shipping-service:3012
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Service: Auth Service
  # Port: container 3001 | host không publish
  # Vai trò: đăng nhập, phiên người dùng, Keycloak và phân quyền.
  # Kết nối chính: PostgreSQL, Keycloak và Kafka.
  auth-service:
    container_name: bin-ecommerce-app-auth-service
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    image: bin-ecommerce/auth-service:local
    environment:
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-development}
      POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_SSL: ${POSTGRES_SSL:-true}
      POSTGRES_POOL_MIN: ${POSTGRES_POOL_MIN:-1}
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-5}
      POSTGRES_IDLE_TIMEOUT_MS: ${POSTGRES_IDLE_TIMEOUT_MS:-30000}
      POSTGRES_CONNECTION_TIMEOUT_MS: ${POSTGRES_CONNECTION_TIMEOUT_MS:-10000}
      POSTGRES_USER: ${POSTGRES_USER:-bin_ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bin_ecommerce_auth
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KEYCLOAK_REALM: bin-ecommerce
      KEYCLOAK_CLIENT_ID: auth-service
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Set KEYCLOAK_CLIENT_SECRET in .env}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-auth-service-admin}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      KEYCLOAK_WEB_CLIENT_ID: web-client
      KEYCLOAK_WEB_CLIENT_SECRET: ${KEYCLOAK_WEB_CLIENT_SECRET:-}
      FRONTEND_URL: http://localhost:5173
      SOCIAL_AUTH_CALLBACK_URL: http://localhost:5173/callback
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_DB: ${REDIS_DB:-0}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------------
  # 02. Dịch vụ thương mại cốt lõi
  # --------------------------------------------------------------------------
  # Service: Seller Service
  # Port: container 3007 | host không publish
  # Vai trò: quản lý hồ sơ shop và quy trình đăng ký người bán.
  # Kết nối chính: PostgreSQL, Auth, Product, Catalog và Kafka.
  seller-service:
    container_name: bin-ecommerce-app-seller-service
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/seller-service/Dockerfile
    image: bin-ecommerce/seller-service:local
    environment:
      PORT: 3007
      NODE_ENV: ${NODE_ENV:-development}
      APP_VERSION: 1.0.0
      POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_SSL: ${POSTGRES_SSL:-true}
      POSTGRES_POOL_MIN: ${POSTGRES_POOL_MIN:-1}
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-5}
      POSTGRES_IDLE_TIMEOUT_MS: ${POSTGRES_IDLE_TIMEOUT_MS:-30000}
      POSTGRES_CONNECTION_TIMEOUT_MS: ${POSTGRES_CONNECTION_TIMEOUT_MS:-10000}
      POSTGRES_USER: ${POSTGRES_USER:-bin_ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bin_ecommerce_seller
      AUTH_SERVICE_URL: http://auth-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3008
      CATALOG_SERVICE_URL: http://catalog-service:3003
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: seller-service
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3007/api/v1/health",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  # Service: Product Service
  # Port: container 3008 | host không publish
  # Vai trò: quản lý sản phẩm, biến thể, trạng thái và dữ liệu bán hàng.
  # Kết nối chính: PostgreSQL, Auth, Seller, Catalog, Media, Order và Kafka.
  product-service:
    container_name: bin-ecommerce-app-product-service
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    image: bin-ecommerce/product-service:local
    environment:
      PORT: 3008
      NODE_ENV: ${NODE_ENV:-development}
      POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_SSL: ${POSTGRES_SSL:-true}
      POSTGRES_POOL_MIN: ${POSTGRES_POOL_MIN:-1}
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-5}
      POSTGRES_IDLE_TIMEOUT_MS: ${POSTGRES_IDLE_TIMEOUT_MS:-30000}
      POSTGRES_CONNECTION_TIMEOUT_MS: ${POSTGRES_CONNECTION_TIMEOUT_MS:-10000}
      POSTGRES_USER: ${POSTGRES_USER:-bin_ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bin_ecommerce_product
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      ORDER_SERVICE_URL: http://order-service:3011
      AUTH_SERVICE_URL: http://auth-service:3001
      SELLER_SERVICE_URL: http://seller-service:3007
      CATALOG_SERVICE_URL: http://catalog-service:3003
      MEDIA_SERVICE_URL: http://media-service:3004
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: product-service
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3008/api/v1/health",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  # Service: Catalog Service
  # Port: container 3003 | host không publish
  # Vai trò: cung cấp read model catalog cho truy vấn nhanh.
  # Kết nối chính: PostgreSQL.
  catalog-service:
    container_name: bin-ecommerce-app-catalog-service
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    image: bin-ecommerce/catalog-service:local
    environment:
      PORT: 3003
      NODE_ENV: ${NODE_ENV:-development}
      POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_SSL: ${POSTGRES_SSL:-true}
      POSTGRES_POOL_MIN: ${POSTGRES_POOL_MIN:-1}
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-5}
      POSTGRES_IDLE_TIMEOUT_MS: ${POSTGRES_IDLE_TIMEOUT_MS:-30000}
      POSTGRES_CONNECTION_TIMEOUT_MS: ${POSTGRES_CONNECTION_TIMEOUT_MS:-10000}
      POSTGRES_USER: ${POSTGRES_USER:-bin_ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bin_ecommerce_catalog
      TYPEORM_LOGGING: ${CATALOG_TYPEORM_LOGGING:-false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Service: Media Service
  # Port: container 3004 | host không publish
  # Vai trò: tạo upload URL, quản lý asset và phân phối qua CDN.
  # Kết nối chính: Auth, S3/CloudFront và internal service token.
  media-service:
    container_name: bin-ecommerce-app-media-service
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/media-service/Dockerfile
    image: bin-ecommerce/media-service:local
    environment:
      PORT: 3004
      NODE_ENV: ${NODE_ENV:-development}
      APP_VERSION: 1.0.0
      AUTH_SERVICE_URL: http://auth-service:3001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-bin-ecommerce}
      # Credential local/demo để AWS SDK ký presigned upload; production nên dùng IAM Role.
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in .env}
      MEDIA_PUBLIC_CDN_URL: ${MEDIA_PUBLIC_CDN_URL:-https://dlmj9cgl5muim.cloudfront.net}
      MEDIA_REQUEST_BODY_LIMIT: ${MEDIA_REQUEST_BODY_LIMIT:-12mb}
      MEDIA_UPLOAD_EXPIRES_SECONDS: ${MEDIA_UPLOAD_EXPIRES_SECONDS:-300}
      MEDIA_MAX_UPLOAD_SIZE_BYTES: ${MEDIA_MAX_UPLOAD_SIZE_BYTES:-5242880}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3004/api/v1/health/live",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # --------------------------------------------------------------------------
  # 03. Recommendation và AI
  # --------------------------------------------------------------------------
  # Service: Recommendation Service
  # Port: container 3006 | host không publish
  # Vai trò: thu thập candidate, ranking, cache, session và analytics.
  # Kết nối chính: PostgreSQL, Kafka, Qdrant, Product và AI Service.
  recommendation-service:
    container_name: bin-ecommerce-app-recommendation-service
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/recommendation-service/Dockerfile
    image: bin-ecommerce/recommendation-service:local
    environment:
      PORT: 3006
      NODE_ENV: ${NODE_ENV:-development}
      POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_SSL: ${POSTGRES_SSL:-true}
      POSTGRES_POOL_MIN: ${POSTGRES_POOL_MIN:-1}
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-5}
      POSTGRES_IDLE_TIMEOUT_MS: ${POSTGRES_IDLE_TIMEOUT_MS:-30000}
      POSTGRES_CONNECTION_TIMEOUT_MS: ${POSTGRES_CONNECTION_TIMEOUT_MS:-10000}
      POSTGRES_USER: ${POSTGRES_USER:-bin_ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bin_ecommerce_recommendation
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: recommendation-service
      KAFKA_CONSUMER_GROUP: recommendation-interactions-v1
      PRODUCT_SERVICE_URL: http://product-service:3008
      AUTH_SERVICE_URL: http://auth-service:3001
      AI_SERVICE_URL: http://ai-service:3009
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_DB: ${REDIS_DB_RECOMMENDATION:-1}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      KAFKA_RETRY_BASE_DELAY_MS: ${KAFKA_RETRY_BASE_DELAY_MS:-250}
      KAFKA_RETRY_MAX_DELAY_MS: ${KAFKA_RETRY_MAX_DELAY_MS:-5000}
      EMBEDDING_JOB_MAX_ATTEMPTS: ${EMBEDDING_JOB_MAX_ATTEMPTS:-8}
      RECOMMENDATION_RETENTION_ENABLED: ${RECOMMENDATION_RETENTION_ENABLED:-false}
      RECOMMENDATION_RAW_RETENTION_DAYS: ${RECOMMENDATION_RAW_RETENTION_DAYS:-90}
      RECOMMENDATION_AGGREGATE_RETENTION_DAYS: ${RECOMMENDATION_AGGREGATE_RETENTION_DAYS:-365}
      RECOMMENDATION_RELATION_SAFETY_DAYS: ${RECOMMENDATION_RELATION_SAFETY_DAYS:-7}
      RECOMMENDATION_EMBEDDING_JOB_RETENTION_DAYS: ${RECOMMENDATION_EMBEDDING_JOB_RETENTION_DAYS:-90}
      RECOMMENDATION_REPLAY_JOB_RETENTION_DAYS: ${RECOMMENDATION_REPLAY_JOB_RETENTION_DAYS:-30}
      QDRANT_URL: ${QDRANT_URL:?Set QDRANT_URL in .env}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION_ALIAS: recommendation_product_embeddings_current
      QDRANT_COLLECTION_VERSION: ${QDRANT_COLLECTION_VERSION:-1}
      QDRANT_ALIAS_PROMOTION_ENABLED: ${QDRANT_ALIAS_PROMOTION_ENABLED:-false}
      QDRANT_VECTOR_SIZE: ${EMBEDDING_DIMENSIONS:-1536}
      QDRANT_DISTANCE: ${QDRANT_DISTANCE:-Cosine}
      QDRANT_TIMEOUT_MS: ${QDRANT_TIMEOUT_MS:-3000}
      QDRANT_INIT_RETRY_MS: ${QDRANT_INIT_RETRY_MS:-5000}
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:-text-embedding-3-small}
      CANDIDATE_PIPELINE_V3_ENABLED: ${CANDIDATE_PIPELINE_V3_ENABLED:-true}
      SEMANTIC_CANDIDATES_ENABLED: ${SEMANTIC_CANDIDATES_ENABLED:-true}
      CO_BEHAVIOR_CANDIDATES_ENABLED: ${CO_BEHAVIOR_CANDIDATES_ENABLED:-true}
      ML_RANKING_ENABLED: ${ML_RANKING_ENABLED:-true}
      ML_RANKING_BLEND: ${ML_RANKING_BLEND:-0.3}
      ML_RANKING_POLICY_VERSION: ${ML_RANKING_POLICY_VERSION:-ml-hybrid-v1}
      ML_RANKING_TIMEOUT_MS: ${ML_RANKING_TIMEOUT_MS:-150}
      RECOMMENDATION_CACHE_TTL_SECONDS: ${RECOMMENDATION_CACHE_TTL_SECONDS:-300}
      RECOMMENDATION_SESSION_TTL_SECONDS: ${RECOMMENDATION_SESSION_TTL_SECONDS:-86400}
      RECOMMENDATION_SESSION_MAX_RECENT_ITEMS: ${RECOMMENDATION_SESSION_MAX_RECENT_ITEMS:-30}
      RECOMMENDATION_RELATION_CO_VIEW_WEIGHT: ${RECOMMENDATION_RELATION_CO_VIEW_WEIGHT:-1}
      RECOMMENDATION_RELATION_CO_CLICK_WEIGHT: ${RECOMMENDATION_RELATION_CO_CLICK_WEIGHT:-2}
      RECOMMENDATION_RELATION_CO_IMPRESSION_WEIGHT: ${RECOMMENDATION_RELATION_CO_IMPRESSION_WEIGHT:-0.05}
      RECOMMENDATION_RELATION_CO_CART_WEIGHT: ${RECOMMENDATION_RELATION_CO_CART_WEIGHT:-3}
      RECOMMENDATION_RELATION_CO_PURCHASE_WEIGHT: ${RECOMMENDATION_RELATION_CO_PURCHASE_WEIGHT:-6}
      RELATION_SCORE_HALF_LIFE_DAYS: ${RELATION_SCORE_HALF_LIFE_DAYS:-30}
    depends_on:
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3006/api/v1/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Service: AI Service
  # Port: container 3009 | host không publish
  # Vai trò: cung cấp AI API, embedding và dự đoán LightGBM.
  # Kết nối chính: PostgreSQL, Redis, Kafka, OpenAI và model artifact.
  ai-service:
    container_name: bin-ecommerce-app-ai-service
    <<: *service-defaults
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    image: bin-ecommerce/ai-service:local
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./services/ai-service/artifacts:/app/artifacts:ro
      - bin_ecommerce_ai_u2net_cache:/home/aiworker/.u2net
    environment:
      PORT: 3009
      NODE_ENV: ${NODE_ENV:-development}
      AI_RUNTIME_MODE: ${AI_RUNTIME_MODE:-memory}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MEDIA_PUBLIC_CDN_URL: ${MEDIA_PUBLIC_CDN_URL:?Set MEDIA_PUBLIC_CDN_URL in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: ${AI_DATABASE_URL:?Set AI_DATABASE_URL in .env}
      REDIS_URL: ${AI_REDIS_URL:?Set AI_REDIS_URL in .env}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      MEDIA_SERVICE_URL: http://media-service:3004
      PRODUCT_SERVICE_URL: http://product-service:3008
      RECOMMENDATION_SERVICE_URL: http://recommendation-service:3006
      AI_IMAGE_BACKGROUND_ENCRYPTION_KEY: ${AI_IMAGE_BACKGROUND_ENCRYPTION_KEY:?Set AI_IMAGE_BACKGROUND_ENCRYPTION_KEY in .env}
      AI_IMAGE_RATE_LIMIT_REQUESTS: ${AI_IMAGE_RATE_LIMIT_REQUESTS:-3}
      AI_IMAGE_RATE_LIMIT_WINDOW_SECONDS: ${AI_IMAGE_RATE_LIMIT_WINDOW_SECONDS:-3600}
      AI_IMAGE_PREVIEW_QUALITY: ${AI_IMAGE_PREVIEW_QUALITY:-low}
      AI_IMAGE_PREVIEW_SIZE: ${AI_IMAGE_PREVIEW_SIZE:-1024x1024}
      AI_IMAGE_PREVIEW_FORMAT: ${AI_IMAGE_PREVIEW_FORMAT:-jpeg}
      AI_IMAGE_PREVIEW_COMPRESSION: ${AI_IMAGE_PREVIEW_COMPRESSION:-65}
      AI_IMAGE_PREVIEW_MAX_DIMENSION: ${AI_IMAGE_PREVIEW_MAX_DIMENSION:-768}
      AI_IMAGE_PREVIEW_INPUT_FIDELITY: ${AI_IMAGE_PREVIEW_INPUT_FIDELITY:-high}
      AI_IMAGE_PREVIEW_TIMEOUT_SECONDS: ${AI_IMAGE_PREVIEW_TIMEOUT_SECONDS:-120}
      RANKING_MODEL_PATH: ${RANKING_MODEL_PATH:-}
      RANKING_MODEL_VERSION: ${RANKING_MODEL_VERSION:-ranking-fallback-v1}
      RANKING_EXPECTED_FEATURES: ${RANKING_EXPECTED_FEATURES:-9}
      U2NET_HOME: /home/aiworker/.u2net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m
        reservations:
          cpus: "0.25"
          memory: 256m
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:3009/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      media-service:
        condition: service_healthy
      product-service:
        condition: service_healthy

  # Service: AI Embedding Worker
  # Port: không có HTTP port | chạy background process
  # Vai trò: nhận job embedding từ Kafka và ghi kết quả qua pipeline AI.
  # Kết nối chính: Kafka, Redis, OpenAI và internal service token.
  ai-embedding-worker:
    container_name: bin-ecommerce-app-ai-embedding-worker
    <<: *service-defaults
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    image: bin-ecommerce/ai-embedding-worker:local
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["python"]
    command: ["-m", "app.entrypoints.workers.embedding_worker"]
    # Worker không mở HTTP port nên không dùng healthcheck /api/health của API image.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512m
        reservations:
          cpus: "0.1"
          memory: 128m
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      REDIS_URL: ${AI_REDIS_URL:?Set AI_REDIS_URL in .env}
      EMBEDDING_RESULT_CACHE_TTL_SECONDS: ${EMBEDDING_RESULT_CACHE_TTL_SECONDS:-600}

  # Service: AI Image Optimization Worker
  # Port: không có HTTP port | chạy background process
  # Vai trò: đọc job tối ưu ảnh từ Kafka, gọi provider và lưu kết quả qua Media Service.
  # Kết nối chính: PostgreSQL, Kafka, Media Service, Redis và OpenAI.
  ai-image-optimization-worker:
    container_name: bin-ecommerce-app-ai-image-optimization-worker
    <<: *service-defaults
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    image: bin-ecommerce/ai-image-optimization-worker:local
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["python"]
    command: ["-m", "app.entrypoints.workers.image_optimization_worker"]
    # Worker chạy nền qua Kafka, trạng thái sống được theo dõi bằng process/container.
    healthcheck:
      disable: true
    volumes:
      - ./services/ai-service/artifacts:/app/artifacts:ro
      - bin_ecommerce_ai_u2net_cache:/home/aiworker/.u2net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m
        reservations:
          cpus: "0.25"
          memory: 256m
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      AI_RUNTIME_MODE: service
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: ${AI_DATABASE_URL:?Set AI_DATABASE_URL in .env}
      REDIS_URL: ${AI_REDIS_URL:?Set AI_REDIS_URL in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      MEDIA_SERVICE_URL: http://media-service:3004
      PRODUCT_SERVICE_URL: http://product-service:3008
      AI_IMAGE_OPTIMIZATION_ENABLED: ${AI_IMAGE_OPTIMIZATION_ENABLED:-false}
      AI_IMAGE_BACKGROUND_ENCRYPTION_KEY: ${AI_IMAGE_BACKGROUND_ENCRYPTION_KEY:-}
      KAFKA_IMAGE_OPTIMIZATION_TOPIC: ${KAFKA_IMAGE_OPTIMIZATION_TOPIC:-ai.image-optimization.requested.v1}
      KAFKA_IMAGE_OPTIMIZATION_DLQ_TOPIC: ${KAFKA_IMAGE_OPTIMIZATION_DLQ_TOPIC:-ai.image-optimization.dlq.v1}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-ai-service.image-optimization-worker.v1}
      AI_IMAGE_MAX_RETRY_ATTEMPTS: ${AI_IMAGE_MAX_RETRY_ATTEMPTS:-3}
      AI_IMAGE_JOB_LEASE_SECONDS: ${AI_IMAGE_JOB_LEASE_SECONDS:-300}
      AI_IMAGE_REVIEW_RETENTION_DAYS: ${AI_IMAGE_REVIEW_RETENTION_DAYS:-30}
      AI_IMAGE_WORKER_CONCURRENCY: ${AI_IMAGE_WORKER_CONCURRENCY:-2}
      AI_IMAGE_KAFKA_POLL_TIMEOUT_MS: ${AI_IMAGE_KAFKA_POLL_TIMEOUT_MS:-250}
      AI_IMAGE_MAX_DIMENSION: ${AI_IMAGE_MAX_DIMENSION:-2048}
      AI_IMAGE_WEBP_QUALITY: ${AI_IMAGE_WEBP_QUALITY:-88}
      AI_IMAGE_PROVIDER_MAX_CONCURRENCY: ${AI_IMAGE_PROVIDER_MAX_CONCURRENCY:-2}
      AI_IMAGE_GENERATED_MAX_BYTES: ${AI_IMAGE_GENERATED_MAX_BYTES:-20000000}
      AI_IMAGE_PREVIEW_QUALITY: ${AI_IMAGE_PREVIEW_QUALITY:-low}
      AI_IMAGE_PREVIEW_SIZE: ${AI_IMAGE_PREVIEW_SIZE:-1024x1024}
      AI_IMAGE_PREVIEW_FORMAT: ${AI_IMAGE_PREVIEW_FORMAT:-jpeg}
      AI_IMAGE_PREVIEW_COMPRESSION: ${AI_IMAGE_PREVIEW_COMPRESSION:-65}
      AI_IMAGE_PREVIEW_MAX_DIMENSION: ${AI_IMAGE_PREVIEW_MAX_DIMENSION:-768}
      AI_IMAGE_PREVIEW_INPUT_FIDELITY: ${AI_IMAGE_PREVIEW_INPUT_FIDELITY:-high}
      AI_IMAGE_PREVIEW_TIMEOUT_SECONDS: ${AI_IMAGE_PREVIEW_TIMEOUT_SECONDS:-120}
      AI_IMAGE_FINAL_QUALITY: ${AI_IMAGE_FINAL_QUALITY:-medium}
      AI_IMAGE_FINAL_SIZE: ${AI_IMAGE_FINAL_SIZE:-1024x1024}
      AI_IMAGE_FINAL_FORMAT: ${AI_IMAGE_FINAL_FORMAT:-jpeg}
      AI_IMAGE_FINAL_COMPRESSION: ${AI_IMAGE_FINAL_COMPRESSION:-85}
      AI_IMAGE_FINAL_MAX_DIMENSION: ${AI_IMAGE_FINAL_MAX_DIMENSION:-1024}
      AI_IMAGE_FINAL_INPUT_FIDELITY: ${AI_IMAGE_FINAL_INPUT_FIDELITY:-high}
      AI_IMAGE_FINAL_TIMEOUT_SECONDS: ${AI_IMAGE_FINAL_TIMEOUT_SECONDS:-120}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      OPENAI_IMAGE_TIMEOUT_SECONDS: ${OPENAI_IMAGE_TIMEOUT_SECONDS:-120}
      OPENAI_IMAGE_OUTPUT_HOSTS: ${OPENAI_IMAGE_OUTPUT_HOSTS:-oaidalleapiprodscus.blob.core.windows.net,cdn.openai.com}
      U2NET_HOME: /home/aiworker/.u2net
    depends_on:
      media-service:
        condition: service_healthy

  # Service: AI Outbox Relay
  # Port: không có HTTP port | chạy background process
  # Vai trò: đọc bản ghi outbox PostgreSQL và publish event sang Kafka.
  # Kết nối chính: PostgreSQL và Kafka; không gọi provider AI trực tiếp.
  ai-outbox-relay:
    container_name: bin-ecommerce-app-ai-outbox-relay
    <<: *service-defaults
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    image: bin-ecommerce/ai-outbox-relay:local
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint: ["python"]
    command: ["-m", "app.entrypoints.workers.outbox_relay"]
    # Relay không cung cấp HTTP endpoint nên không chạy probe của API service.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384m
        reservations:
          cpus: "0.1"
          memory: 128m
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      AI_RUNTIME_MODE: service
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: ${AI_DATABASE_URL:?Set AI_DATABASE_URL in .env}
      REDIS_URL: ${AI_REDIS_URL:?Set AI_REDIS_URL in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      AI_IMAGE_OPTIMIZATION_ENABLED: ${AI_IMAGE_OPTIMIZATION_ENABLED:-false}
      AI_IMAGE_BACKGROUND_ENCRYPTION_KEY: ${AI_IMAGE_BACKGROUND_ENCRYPTION_KEY:-}
      KAFKA_IMAGE_OPTIMIZATION_TOPIC: ${KAFKA_IMAGE_OPTIMIZATION_TOPIC:-ai.image-optimization.requested.v1}
      KAFKA_IMAGE_OPTIMIZATION_DLQ_TOPIC: ${KAFKA_IMAGE_OPTIMIZATION_DLQ_TOPIC:-ai.image-optimization.dlq.v1}
      AI_IMAGE_OUTBOX_MAX_ATTEMPTS: ${AI_IMAGE_OUTBOX_MAX_ATTEMPTS:-8}
      AI_IMAGE_OUTBOX_POLL_INTERVAL_MS: ${AI_IMAGE_OUTBOX_POLL_INTERVAL_MS:-250}
  # --------------------------------------------------------------------------
  # 04. Giỏ hàng và đơn hàng
  # --------------------------------------------------------------------------
  # Service: Cart Service
  # Port: container 3003 | host không publish
  # Vai trò: tạo, cập nhật và đọc giỏ hàng của người dùng.
  # Kết nối chính: PostgreSQL, Product và internal service token.
  cart-service:
    container_name: bin-ecommerce-app-cart-service
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/cart-service/Dockerfile
    image: bin-ecommerce/cart-service:local
    environment:
      PORT: 3003
      NODE_ENV: ${NODE_ENV:-development}
      POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_SSL: ${POSTGRES_SSL:-true}
      POSTGRES_POOL_MIN: ${POSTGRES_POOL_MIN:-1}
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-5}
      POSTGRES_IDLE_TIMEOUT_MS: ${POSTGRES_IDLE_TIMEOUT_MS:-30000}
      POSTGRES_CONNECTION_TIMEOUT_MS: ${POSTGRES_CONNECTION_TIMEOUT_MS:-10000}
      POSTGRES_USER: ${POSTGRES_USER:-bin_ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bin_ecommerce_cart
      PRODUCT_SERVICE_URL: http://product-service:3008
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
    depends_on:
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Service: Order Service
  # Port: container 3011 | host không publish
  # Vai trò: tạo đơn, xử lý trạng thái và đồng bộ vận chuyển.
  # Kết nối chính: PostgreSQL, Cart, Auth, Product, Seller, Shipping và Kafka.
  order-service:
    container_name: bin-ecommerce-app-order-service
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    image: bin-ecommerce/order-service:local
    environment:
      PORT: 3011
      NODE_ENV: ${NODE_ENV:-development}
      POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_SSL: ${POSTGRES_SSL:-true}
      POSTGRES_POOL_MIN: ${POSTGRES_POOL_MIN:-1}
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-5}
      POSTGRES_IDLE_TIMEOUT_MS: ${POSTGRES_IDLE_TIMEOUT_MS:-30000}
      POSTGRES_CONNECTION_TIMEOUT_MS: ${POSTGRES_CONNECTION_TIMEOUT_MS:-10000}
      POSTGRES_USER: ${POSTGRES_USER:-bin_ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bin_ecommerce_order
      CART_SERVICE_URL: http://cart-service:3003
      AUTH_SERVICE_URL: http://auth-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3008
      SELLER_SERVICE_URL: http://seller-service:3007
      SHIPPING_SERVICE_URL: http://shipping-service:3012
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: order-service
      KAFKA_ORDER_GROUP_ID: order-service-shipment-sync-v3
      KAFKA_PUBLISH_TIMEOUT_MS: ${KAFKA_PUBLISH_TIMEOUT_MS:-10000}
      TYPEORM_LOGGING: ${ORDER_TYPEORM_LOGGING:-false}
    depends_on:
      cart-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3011/api/v1/health",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  # --------------------------------------------------------------------------
  # 05. Notification và shipping
  # --------------------------------------------------------------------------
  # Service: Notification Service
  # Port: container 3005 | host không publish
  # Vai trò: lưu thông báo và gửi email theo event nghiệp vụ.
  # Kết nối chính: MongoDB, Redis, Kafka, Auth và SMTP.
  notification-service:
    container_name: bin-ecommerce-app-notification-service
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    image: bin-ecommerce/notification-service:local
    environment:
      PORT: 3005
      NODE_ENV: ${NODE_ENV:-development}
      APP_VERSION: 1.0.0
      MONGODB_URI: "${MONGODB_URI:?Set MONGODB_URI in .env}"
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: notification-service
      AUTH_SERVICE_URL: http://auth-service:3001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDIS_DB: ${REDIS_DB:-0}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@binecommerce.local}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:5173}
      EMAIL_LOGO_PATH: assets/email/logo_background_white.png
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3005/api/v1/health",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Service: Shipping Service
  # Port: container 3012 -> host 3012
  # Vai trò: tính phí, tạo vận đơn và đồng bộ trạng thái giao hàng.
  # Kết nối chính: PostgreSQL, Order, Seller, Kafka và GHN.
  shipping-service:
    container_name: bin-ecommerce-app-shipping-service
    <<: *service-defaults
    build:
      context: .
      dockerfile: services/shipping-service/Dockerfile
    image: bin-ecommerce/shipping-service:local
    ports:
      - "3012:3012"
    environment:
      PORT: 3012
      NODE_ENV: ${NODE_ENV:-development}
      APP_VERSION: 1.0.0
      TYPEORM_LOGGING: ${SHIPPING_TYPEORM_LOGGING:-false}
      POSTGRES_HOST: ${POSTGRES_HOST:?Set POSTGRES_HOST in .env}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_SSL: ${POSTGRES_SSL:-true}
      POSTGRES_POOL_MIN: ${POSTGRES_POOL_MIN:-1}
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-5}
      POSTGRES_IDLE_TIMEOUT_MS: ${POSTGRES_IDLE_TIMEOUT_MS:-30000}
      POSTGRES_CONNECTION_TIMEOUT_MS: ${POSTGRES_CONNECTION_TIMEOUT_MS:-10000}
      POSTGRES_USER: ${POSTGRES_USER:-bin_ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: bin_shipping
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: shipping-service
      KAFKA_GROUP_ID: shipping-service
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN in .env}
      ORDER_SERVICE_URL: http://order-service:3011
      SELLER_SERVICE_URL: http://seller-service:3007
      GHN_BASE_URL: ${GHN_BASE_URL:-https://dev-online-gateway.ghn.vn}
      GHN_TOKEN: ${GHN_TOKEN:-}
      GHN_SHOP_ID: ${GHN_SHOP_ID:-}
      GHN_CLIENT_ID: ${GHN_CLIENT_ID:-}
      GHN_SERVICE_TYPE_ID: ${GHN_SERVICE_TYPE_ID:-2}
      GHN_REQUEST_TIMEOUT_MS: ${GHN_REQUEST_TIMEOUT_MS:-10000}
      SHIPPING_DEMO_MODE: ${SHIPPING_DEMO_MODE:-true}
      MAP_DEFAULT_LATITUDE: ${MAP_DEFAULT_LATITUDE:-10.7769}
      MAP_DEFAULT_LONGITUDE: ${MAP_DEFAULT_LONGITUDE:-106.7009}
    depends_on:
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3012/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # 06. Public edge
  # --------------------------------------------------------------------------
  # Service: Nginx Reverse Proxy
  # Port: host 80/443
  # Vai trò: cổng public, reverse proxy và điểm kết thúc SSL.
  # Kết nối chính: API Gateway trong application network.
  nginx:
    container_name: bin-ecommerce-app-nginx
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_HTTP_PORT:-8088}:80"
      - "${PUBLIC_HTTPS_PORT:-8443}:443"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - bin_app_net
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

# --------------------------------------------------------------------------
# 07. Volume dùng chung
# --------------------------------------------------------------------------
volumes:
  bin_ecommerce_ai_u2net_cache:
