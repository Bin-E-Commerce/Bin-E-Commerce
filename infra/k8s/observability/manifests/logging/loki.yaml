# Loki lưu log ngắn hạn trên PVC local-path. Đây là cấu hình single-node cho demo,
# không phải HA production; PVC giữ dữ liệu qua Pod recreation trên cùng EC2.
apiVersion: v1
kind: ConfigMap
metadata:
  # Loki single-binary dùng filesystem để tránh thêm object storage/database cho demo.
  name: loki-config
  namespace: bin-ecommerce-observability
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      # 7 ngày giúp tra cứu sự cố vừa xảy ra mà vẫn giới hạn dung lượng EBS.
      retention_period: 168h
      ingestion_rate_mb: 2
      ingestion_burst_size_mb: 4
      allow_structured_metadata: false
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: bin-ecommerce-observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: bin-ecommerce
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  # Loki chỉ nhận log nội bộ từ Alloy; không có Ingress public.
  name: loki
  namespace: bin-ecommerce-observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: bin-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/part-of: bin-ecommerce
    spec:
      # Loki chỉ nhận HTTP push từ Alloy, không cần quyền gọi Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: loki
          image: grafana/loki:3.0.0
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - name: http
              containerPort: 3100
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/loki/loki.yaml
              subPath: loki.yaml
              readOnly: true
            - name: data
              mountPath: /loki
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
---
apiVersion: v1
kind: Service
metadata:
  # Alloy và Grafana dùng Service DNS này để push/query log.
  name: loki
  namespace: bin-ecommerce-observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: bin-ecommerce
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
