# Alloy chạy DaemonSet và đọc log Pod qua Kubernetes API.
# Cách này tránh mount /var/log/pods và tránh chạy collector với quyền root trên host.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: bin-ecommerce-observability
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: bin-ecommerce
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bin-ecommerce-alloy
rules:
  # Alloy cần đọc Pod để discovery và đọc subresource log để stream stdout/stderr.
  # Không cấp quyền tạo, sửa hoặc xoá bất kỳ resource nào.
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bin-ecommerce-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bin-ecommerce-alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: bin-ecommerce-observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: bin-ecommerce-observability
data:
  config.alloy: |
    // Discovery chi lay Pod tren cung node voi Alloy, tranh mot DaemonSet doc trung log.
    discovery.kubernetes "pod" {
      role = "pod"

      selectors {
        role  = "pod"
        # Alloy v1.2.1 dung ham env(); sys.env chi co o cac ban moi hon.
        field = "spec.nodeName=" + env("HOST_NODE_NAME")
      }
    }

    // Tao cac label co cardinality kiem soat tu metadata Kubernetes.
    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pod.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        action        = "replace"
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        action        = "replace"
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        action        = "replace"
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        action        = "replace"
        target_label  = "app"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
        action        = "replace"
        target_label  = "job"
        separator     = "/"
        replacement   = "$1"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_id"]
        action        = "replace"
        target_label  = "container_runtime"
        regex         = `^(\\S+):\\/\\/.+$`
        replacement   = "$1"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        action        = "replace"
        target_label  = "__path__"
        separator     = "/"
        replacement   = "/var/log/pods/*$1/*.log"
      }
    }

    // Stream log qua Kubernetes API, khong can doc host filesystem.
    loki.source.kubernetes "pod_logs" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.process.pod_logs.receiver]
    }

    loki.process "pod_logs" {
      // CRI parser tach timestamp/stream/flag khoi dong log cua containerd.
      stage.cri {}

      stage.static_labels {
        values = {
          cluster = "bin-ecommerce-production",
        }
      }

      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki.bin-ecommerce-observability.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  # Moi node chay mot Alloy; selector node trong config giu log dung node.
  name: alloy
  namespace: bin-ecommerce-observability
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: bin-ecommerce
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/part-of: bin-ecommerce
    spec:
      serviceAccountName: alloy
      # Alloy chay non-root; fsGroup cho phep process ghi checkpoint vao emptyDir.
      # Khong dung chmod/chown tren host va khong mo rong quyen container.
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: alloy
          image: grafana/alloy:v1.2.1
          env:
            # HOSTNAME trong container la ten Pod; dung downward API de lay ten node.
            - name: HOST_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 15m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 192Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alloy/config.alloy
              subPath: config.alloy
              readOnly: true
            - name: alloy-data
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: alloy-data
          # Chi luu positions/checkpoint; mat file nay chi lam Alloy doc lai log gan day.
          emptyDir:
            sizeLimit: 128Mi
