# Grafana chỉ cung cấp dashboard và Explore nội bộ. Datasource/dashboard được
# provision từ ConfigMap để không phải cấu hình thủ công sau mỗi lần deploy.
apiVersion: v1
kind: ConfigMap
metadata:
  # Datasource dùng DNS Service nội bộ; không phụ thuộc IP Pod thay đổi sau rollout.
  name: grafana-datasources
  namespace: bin-ecommerce-observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.bin-ecommerce-observability.svc.cluster.local:9090
        isDefault: true
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.bin-ecommerce-observability.svc.cluster.local:3100
---
apiVersion: v1
kind: ConfigMap
metadata:
  # Provider tự nạp dashboard JSON khi Grafana khởi động.
  name: grafana-dashboard-provider
  namespace: bin-ecommerce-observability
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: bin-ecommerce
        orgId: 1
        folder: Bin E-Commerce
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  # Dashboard nhỏ, ít query để phù hợp node 8 GiB và retention ngắn.
  name: grafana-dashboard-bin-ecommerce
  namespace: bin-ecommerce-observability
data:
  overview.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "panels": [
        {"type":"stat","title":"Targets up","gridPos":{"h":4,"w":6,"x":0,"y":0},"targets":[{"expr":"sum(up)","refId":"A"}]},
        {"type":"stat","title":"Pod restarts (15m)","gridPos":{"h":4,"w":6,"x":6,"y":0},"targets":[{"expr":"sum(increase(kube_pod_container_status_restarts_total[15m]))","refId":"A"}]},
        {"type":"timeseries","title":"Scrape status","gridPos":{"h":8,"w":12,"x":0,"y":4},"targets":[{"expr":"up","legendFormat":"{{job}}","refId":"A"}]},
        {"type":"timeseries","title":"Available memory","gridPos":{"h":8,"w":12,"x":0,"y":12},"targets":[{"expr":"node_memory_MemAvailable_bytes / 1024 / 1024 / 1024","legendFormat":"{{instance}} GiB","refId":"A"}]}
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["bin-ecommerce", "k3s"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "title": "Bin E-Commerce / Platform Overview",
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  # Grafana không giữ vai trò source of truth; cấu hình được khai báo bằng Git.
  name: grafana
  namespace: bin-ecommerce-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: bin-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: bin-ecommerce
    spec:
      # Grafana không gọi Kubernetes API nên không cần token của ServiceAccount.
      automountServiceAccountToken: false
      containers:
        - name: grafana
          image: grafana/grafana:10.4.2
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              # Secret được tạo trên node bởi script, không lưu password trong Git.
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
              readOnly: true
            - name: provider
              mountPath: /etc/grafana/provisioning/dashboards/provider.yaml
              subPath: provider.yaml
              readOnly: true
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard
          configMap:
            name: grafana-dashboard-bin-ecommerce
---
apiVersion: v1
kind: Service
metadata:
  # Chỉ port-forward hoặc route qua một lớp authentication nếu cần demo từ ngoài.
  name: grafana
  namespace: bin-ecommerce-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: bin-ecommerce
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
