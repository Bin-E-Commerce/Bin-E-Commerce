# Grafana chỉ cung cấp dashboard và Explore nội bộ. Datasource/dashboard được
# provision từ ConfigMap để không phải cấu hình thủ công sau mỗi lần deploy.
apiVersion: v1
kind: ConfigMap
metadata:
  # Datasource dùng DNS Service nội bộ; không phụ thuộc IP Pod thay đổi sau rollout.
  name: grafana-datasources
  namespace: bin-ecommerce-observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.bin-ecommerce-observability.svc.cluster.local:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.bin-ecommerce-observability.svc.cluster.local:3100
---
apiVersion: v1
kind: ConfigMap
metadata:
  # Provider tự nạp dashboard JSON khi Grafana khởi động.
  name: grafana-dashboard-provider
  namespace: bin-ecommerce-observability
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: bin-ecommerce
        orgId: 1
        folder: Bin E-Commerce
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  # Dashboard nhỏ, ít query để phù hợp node 8 GiB và retention ngắn.
  name: grafana-dashboard-bin-ecommerce
  namespace: bin-ecommerce-observability
data:
  overview.json: |
    {
      "annotations": {"list": []},
      "editable": false,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "panels": [
        {"id":1,"type":"stat","title":"Targets up","description":"Prometheus scrape targets currently responding.","gridPos":{"h":4,"w":4,"x":0,"y":0},"fieldConfig":{"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"red","value":0},{"color":"green","value":1}]}},"overrides":[]},"targets":[{"expr":"sum(up)","refId":"A"}]},
        {"id":2,"type":"stat","title":"Targets down","description":"A non-zero value means Prometheus cannot scrape one or more targets.","gridPos":{"h":4,"w":4,"x":4,"y":0},"fieldConfig":{"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"green","value":0},{"color":"red","value":1}]}},"overrides":[]},"targets":[{"expr":"sum(1 - up)","refId":"A"}]},
        {"id":3,"type":"stat","title":"Ready application pods","description":"Ready Pods in the application and data namespaces.","gridPos":{"h":4,"w":4,"x":8,"y":0},"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]},"targets":[{"expr":"sum(kube_pod_status_ready{condition=\"true\",namespace=~\"bin-ecommerce-app|bin-ecommerce-data\"})","refId":"A"}]},
        {"id":4,"type":"stat","title":"Pod restarts (15m)","description":"Recent container restarts that may indicate crashes or resource pressure.","gridPos":{"h":4,"w":4,"x":12,"y":0},"fieldConfig":{"defaults":{"unit":"short","thresholds":{"mode":"absolute","steps":[{"color":"green","value":0},{"color":"yellow","value":1},{"color":"red","value":5}]}},"overrides":[]},"targets":[{"expr":"sum(increase(kube_pod_container_status_restarts_total{namespace=~\"bin-ecommerce-app|bin-ecommerce-data\"}[15m]))","refId":"A"}]},
        {"id":5,"type":"stat","title":"Node memory used","description":"Percentage of node memory not available to workloads.","gridPos":{"h":4,"w":4,"x":16,"y":0},"fieldConfig":{"defaults":{"unit":"percent","decimals":1,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":0},{"color":"yellow","value":75},{"color":"red","value":90}]}},"overrides":[]},"targets":[{"expr":"100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)","refId":"A"}]},
        {"id":6,"type":"stat","title":"Root disk used","description":"Used space on the root filesystem.","gridPos":{"h":4,"w":4,"x":20,"y":0},"fieldConfig":{"defaults":{"unit":"percent","decimals":1,"thresholds":{"mode":"absolute","steps":[{"color":"green","value":0},{"color":"yellow","value":75},{"color":"red","value":90}]}},"overrides":[]},"targets":[{"expr":"100 * (1 - node_filesystem_avail_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"})","refId":"A"}]},
        {"id":7,"type":"timeseries","title":"Node CPU usage","description":"Average CPU usage calculated from non-idle time.","gridPos":{"h":8,"w":12,"x":0,"y":4},"fieldConfig":{"defaults":{"unit":"percent","min":0,"max":100},"overrides":[]},"targets":[{"expr":"100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))","legendFormat":"{{instance}}","refId":"A"}]},
        {"id":8,"type":"timeseries","title":"Node memory usage","description":"Used and available memory in GiB.","gridPos":{"h":8,"w":12,"x":12,"y":4},"fieldConfig":{"defaults":{"unit":"bytes(IEC)"},"overrides":[]},"targets":[{"expr":"node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes","legendFormat":"Used - {{instance}}","refId":"A"},{"expr":"node_memory_MemAvailable_bytes","legendFormat":"Available - {{instance}}","refId":"B"}]},
        {"id":9,"type":"timeseries","title":"Root filesystem usage","description":"Used and available bytes on the EC2 root filesystem.","gridPos":{"h":8,"w":12,"x":0,"y":12},"fieldConfig":{"defaults":{"unit":"bytes(IEC)"},"overrides":[]},"targets":[{"expr":"node_filesystem_size_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"} - node_filesystem_avail_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"}","legendFormat":"Used - {{instance}}","refId":"A"},{"expr":"node_filesystem_avail_bytes{mountpoint=\"/\",fstype!~\"tmpfs|overlay\"}","legendFormat":"Available - {{instance}}","refId":"B"}]},
        {"id":10,"type":"timeseries","title":"Node load average","description":"One-minute Linux load average; compare with the node vCPU count.","gridPos":{"h":8,"w":12,"x":12,"y":12},"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]},"targets":[{"expr":"node_load1","legendFormat":"{{instance}}","refId":"A"}]},
        {"id":11,"type":"timeseries","title":"Prometheus scrape status","description":"1 means the target is healthy; 0 means scraping is failing.","gridPos":{"h":8,"w":12,"x":0,"y":20},"fieldConfig":{"defaults":{"unit":"short","min":0,"max":1},"overrides":[]},"targets":[{"expr":"up","legendFormat":"{{job}} - {{instance}}","refId":"A"}]},
        {"id":12,"type":"timeseries","title":"Pods by phase","description":"Application and data Pod lifecycle states.","gridPos":{"h":8,"w":12,"x":12,"y":20},"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]},"targets":[{"expr":"sum by (phase) (kube_pod_status_phase{namespace=~\"bin-ecommerce-app|bin-ecommerce-data\"})","legendFormat":"{{phase}}","refId":"A"}]},
        {"id":13,"type":"table","title":"Top restarting pods (1h)","description":"Use this table to identify unstable workloads after a deployment.","gridPos":{"h":8,"w":12,"x":0,"y":28},"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]},"targets":[{"expr":"topk(10, sum by (namespace,pod,container) (increase(kube_pod_container_status_restarts_total{namespace=~\"bin-ecommerce-app|bin-ecommerce-data|bin-ecommerce-observability\"}[1h])))","format":"table","instant":true,"refId":"A"}]},
        {"id":14,"type":"timeseries","title":"Deployment available replicas","description":"Available replicas for application Deployments.","gridPos":{"h":8,"w":12,"x":12,"y":28},"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]},"targets":[{"expr":"kube_deployment_status_replicas_available{namespace=\"bin-ecommerce-app\"}","legendFormat":"{{deployment}}","refId":"A"}]},
        {"id":15,"type":"timeseries","title":"Application Pod readiness","description":"Ready state per application Pod; 1 is ready and 0 is not ready.","gridPos":{"h":8,"w":12,"x":0,"y":36},"fieldConfig":{"defaults":{"unit":"short","min":0,"max":1},"overrides":[]},"targets":[{"expr":"kube_pod_status_ready{condition=\"true\",namespace=\"bin-ecommerce-app\"}","legendFormat":"{{pod}}","refId":"A"}]},
        {"id":16,"type":"timeseries","title":"Observability component readiness","description":"Health of Prometheus, Grafana, Loki, Alloy, exporters and KSM.","gridPos":{"h":8,"w":12,"x":12,"y":36},"fieldConfig":{"defaults":{"unit":"short","min":0,"max":1},"overrides":[]},"targets":[{"expr":"kube_pod_status_ready{condition=\"true\",namespace=\"bin-ecommerce-observability\"}","legendFormat":"{{pod}}","refId":"A"}]},
        {"id":17,"type":"timeseries","title":"Prometheus samples appended","description":"Approximate samples ingested per second; a sudden increase may indicate query or cardinality growth.","gridPos":{"h":8,"w":12,"x":0,"y":44},"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]},"targets":[{"expr":"rate(prometheus_tsdb_head_samples_appended_total[5m])","legendFormat":"samples/sec","refId":"A"}]},
        {"id":18,"type":"logs","title":"Recent application logs","description":"Live application logs collected by Alloy and stored in Loki.","gridPos":{"h":8,"w":12,"x":12,"y":44},"datasource":{"type":"loki","uid":"loki"},"options":{"showTime":true,"showLabels":true,"showCommonLabels":false,"wrapLines":false,"prettifyLogMessage":false,"enableLogDetails":true,"sortOrder":"Descending"},"targets":[{"expr":"{namespace=\"bin-ecommerce-app\"}","refId":"A"}]},
        {"id":19,"type":"timeseries","title":"HTTP request rate","description":"Requests per second by service; routes are normalized to avoid high-cardinality series.","gridPos":{"h":8,"w":12,"x":0,"y":52},"fieldConfig":{"defaults":{"unit":"reqps"},"overrides":[]},"targets":[{"expr":"sum by (job) (rate(http_requests_total[5m]))","legendFormat":"{{job}}","refId":"A"}]},
        {"id":20,"type":"timeseries","title":"HTTP 5xx rate","description":"Server-error responses by service. Investigate logs when this rises above the alert threshold.","gridPos":{"h":8,"w":12,"x":12,"y":52},"fieldConfig":{"defaults":{"unit":"reqps"},"overrides":[]},"targets":[{"expr":"sum by (job) (rate(http_responses_total{status_class=\"5xx\"}[5m]))","legendFormat":"{{job}}","refId":"A"}]},
        {"id":21,"type":"timeseries","title":"HTTP p95 latency","description":"95th percentile request duration from the application histogram.","gridPos":{"h":8,"w":12,"x":0,"y":60},"fieldConfig":{"defaults":{"unit":"s"},"overrides":[]},"targets":[{"expr":"histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket[5m])))","legendFormat":"{{job}}","refId":"A"}]},
        {"id":22,"type":"timeseries","title":"Kafka consumer availability","description":"Recommendation embedding consumer availability and error counter.","gridPos":{"h":8,"w":12,"x":12,"y":60},"fieldConfig":{"defaults":{"unit":"short","min":0,"max":1},"overrides":[]},"targets":[{"expr":"recommendation_kafka_consumer_available","legendFormat":"{{consumer}} / {{topic}}","refId":"A"},{"expr":"rate(recommendation_kafka_consumer_errors_total[5m])","legendFormat":"errors/sec","refId":"B"}]},
        {"id":23,"type":"timeseries","title":"Node file descriptor pressure","description":"Open file descriptors as a percentage of the kernel limit; useful for fsnotify/socket exhaustion.","gridPos":{"h":8,"w":12,"x":0,"y":68},"fieldConfig":{"defaults":{"unit":"percent","min":0,"max":100},"overrides":[]},"targets":[{"expr":"100 * node_filefd_allocated / node_filefd_maximum","legendFormat":"{{instance}}","refId":"A"}]},
        {"id":24,"type":"logs","title":"Errors and warnings","description":"Filtered application errors and warnings for incident triage.","gridPos":{"h":8,"w":12,"x":12,"y":68},"datasource":{"type":"loki","uid":"loki"},"options":{"showTime":true,"showLabels":true,"showCommonLabels":false,"wrapLines":true,"prettifyLogMessage":true,"enableLogDetails":true,"sortOrder":"Descending"},"targets":[{"expr":"{namespace=\"bin-ecommerce-app\"} |~ \"(?i)error|exception|warn\"","refId":"A"}]}
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["bin-ecommerce", "k3s"],
      "templating": {"list": []},
      "time": {"from": "now-6h", "to": "now"},
      "title": "Bin E-Commerce / Platform Overview",
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  # Grafana không giữ vai trò source of truth; cấu hình được khai báo bằng Git.
  name: grafana
  namespace: bin-ecommerce-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: bin-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: bin-ecommerce
    spec:
      # Grafana không gọi Kubernetes API nên không cần token của ServiceAccount.
      automountServiceAccountToken: false
      containers:
        - name: grafana
          image: grafana/grafana:10.4.2
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              # Secret được tạo trên node bởi script, không lưu password trong Git.
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
              readOnly: true
            - name: provider
              mountPath: /etc/grafana/provisioning/dashboards/provider.yaml
              subPath: provider.yaml
              readOnly: true
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboard
          configMap:
            name: grafana-dashboard-bin-ecommerce
---
apiVersion: v1
kind: Service
metadata:
  # Chỉ port-forward hoặc route qua một lớp authentication nếu cần demo từ ngoài.
  name: grafana
  namespace: bin-ecommerce-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: bin-ecommerce
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
