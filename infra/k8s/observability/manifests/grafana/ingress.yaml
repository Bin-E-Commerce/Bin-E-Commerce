# Grafana la giao dien duy nhat duoc expose ra Internet.
# Prometheus va Loki van la ClusterIP, khong mo cong public cho du lieu metric/log.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bin-ecommerce-grafana
  namespace: bin-ecommerce-observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: bin-ecommerce
  annotations:
    # Traefik xu ly ca HTTP challenge va HTTPS traffic.
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    # cert-manager tu xin va renew certificate Let's Encrypt.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-edit-in-place: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - grafana.binecommerce.site
      secretName: grafana-binecommerce-site-tls
  rules:
    - host: grafana.binecommerce.site
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
