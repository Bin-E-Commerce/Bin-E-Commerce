# Prometheus chỉ scrape các target có endpoint metrics ổn định. Trạng thái Pod/node
# được lấy qua exporters; không scrape tuỳ tiện mọi Pod để tránh tạo tải và cardinality.
apiVersion: v1
kind: ConfigMap
metadata:
  # Config và alert rules cùng được mount vào Pod. Script sẽ restart Prometheus
  # sau apply để chắc chắn rule/config mới được nạp, không phụ thuộc reload tự động.
  name: prometheus-config
  namespace: bin-ecommerce-observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      # Self-scrape giúp kiểm tra Prometheus còn hoạt động và query được dữ liệu.
      - job_name: prometheus
        static_configs:
          - targets: [127.0.0.1:9090]

      - job_name: node-exporter
        static_configs:
          - targets: [node-exporter.bin-ecommerce-observability.svc.cluster.local:9100]

      - job_name: kube-state-metrics
        static_configs:
          - targets: [kube-state-metrics.bin-ecommerce-observability.svc.cluster.local:8080]

      # Tất cả service dùng cùng /metrics; route này nằm ngoài /api để scrape không phụ thuộc API version.
      - job_name: api-gateway
        metrics_path: /metrics
        static_configs:
          - targets: [bin-ecommerce-api-gateway.bin-ecommerce-app.svc.cluster.local:80]

      - job_name: auth-service
        metrics_path: /metrics
        static_configs:
          - targets: [auth-service.bin-ecommerce-app.svc.cluster.local:3002]

      - job_name: cart-service
        metrics_path: /metrics
        static_configs:
          - targets: [cart-service.bin-ecommerce-app.svc.cluster.local:3003]

      - job_name: catalog-service
        metrics_path: /metrics
        static_configs:
          - targets: [catalog-service.bin-ecommerce-app.svc.cluster.local:3003]

      - job_name: media-service
        metrics_path: /metrics
        static_configs:
          - targets: [media-service.bin-ecommerce-app.svc.cluster.local:3004]

      - job_name: notification-service
        metrics_path: /metrics
        static_configs:
          - targets: [notification-service.bin-ecommerce-app.svc.cluster.local:3005]

      - job_name: order-service
        metrics_path: /metrics
        static_configs:
          - targets: [order-service.bin-ecommerce-app.svc.cluster.local:3011]

      - job_name: product-service
        metrics_path: /metrics
        static_configs:
          - targets: [product-service.bin-ecommerce-app.svc.cluster.local:3008]

      - job_name: recommendation-service
        metrics_path: /metrics
        static_configs:
          - targets: [recommendation-service.bin-ecommerce-app.svc.cluster.local:3006]

      # Endpoint legacy giữ các metric Kafka/embedding riêng của Recommendation Service.
      - job_name: recommendation-kafka
        metrics_path: /api/v1/health/metrics
        static_configs:
          - targets: [recommendation-service.bin-ecommerce-app.svc.cluster.local:3006]

      - job_name: seller-service
        metrics_path: /metrics
        static_configs:
          - targets: [seller-service.bin-ecommerce-app.svc.cluster.local:3007]

      - job_name: shipping-service
        metrics_path: /metrics
        static_configs:
          - targets: [shipping-service.bin-ecommerce-app.svc.cluster.local:3012]

      - job_name: ai-service
        metrics_path: /metrics
        static_configs:
          - targets: [ai-service.bin-ecommerce-app.svc.cluster.local:3009]

    alerting:
      # Chưa gửi notification ra ngoài; alert vẫn hiện trong Prometheus/Grafana.
      # Alertmanager sẽ được bổ sung khi cần email/Slack và có secret receiver.
      alertmanagers: []

  alerts.yml: |
    groups:
      - name: bin-ecommerce-platform
        rules:
          - alert: PodRestarting
            expr: increase(kube_pod_container_status_restarts_total[15m]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Pod restarted recently
              description: A container in namespace {{ $labels.namespace }} has restarted.

          - alert: PodNotReady
            expr: kube_pod_status_ready{condition="true",namespace=~"bin-ecommerce-app|bin-ecommerce-data"} == 0
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Pod is not ready
              description: Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready.

          - alert: NodeMemoryAvailableLow
            expr: 100 * node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 15
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Node memory is low
              description: Available memory on {{ $labels.instance }} is below 15 percent.

          - alert: NodeDiskAvailableLow
            expr: 100 * node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"} < 20
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Node disk is nearly full
              description: Available root filesystem space is below 20 percent.

          - alert: ScrapeTargetDown
            expr: up == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Monitoring target is down
              description: Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }}.

          - alert: ApplicationHttp5xxHigh
            expr: sum by (job) (rate(http_responses_total{status_class="5xx"}[5m])) > 0.1
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Application 5xx responses are increasing
              description: Service {{ $labels.job }} is returning more than 0.1 5xx responses per second.

          - alert: KafkaConsumerUnavailable
            expr: recommendation_kafka_consumer_available == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Recommendation Kafka consumer is unavailable
              description: Consumer {{ $labels.consumer }} cannot consume topic {{ $labels.topic }}.

          - alert: NodeFileDescriptorPressure
            expr: node_filefd_allocated / node_filefd_maximum > 0.8
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: Node file descriptor usage is high
              description: File descriptor usage on {{ $labels.instance }} is above 80 percent.
---
apiVersion: v1
kind: Service
metadata:
  # ClusterIP giữ Prometheus trong cluster, không mở cổng 9090 trên EC2.
  name: prometheus
  namespace: bin-ecommerce-observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: bin-ecommerce
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: bin-ecommerce-observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: bin-ecommerce
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  # Một replica đủ cho demo single-node; HA cần nhiều node và persistent storage.
  name: prometheus
  namespace: bin-ecommerce-observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: bin-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: bin-ecommerce
    spec:
      # Prometheus dùng static targets nên không cần quyền gọi Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.2
          args:
            # Retention theo cả thời gian và kích thước để bảo vệ RAM/EBS khi log/metric tăng.
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --storage.tsdb.retention.size=1536MB
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: config
              mountPath: /etc/prometheus/rules/alerts.yml
              subPath: alerts.yml
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          # PVC giữ metrics qua Pod recreation; retention và giới hạn size bảo vệ EBS single-node.
          persistentVolumeClaim:
            claimName: prometheus-data
