# Kube-state-metrics đọc trạng thái Kubernetes qua API server và xuất thành metrics.
# ServiceAccount chỉ có quyền list/watch các resource cần thiết, không có quyền sửa cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  # Token được dùng bởi KSM để đọc resource state từ Kubernetes API.
  name: kube-state-metrics
  namespace: bin-ecommerce-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # Quyền read-only tối thiểu cho các resource được dùng trong dashboard/alerts.
  name: bin-ecommerce-kube-state-metrics
rules:
  - apiGroups: [""]
    resources:
      [
        "pods",
        "nodes",
        "services",
        "deployments",
        "replicasets",
        "statefulsets",
        "daemonsets",
        "namespaces",
      ]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bin-ecommerce-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bin-ecommerce-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: bin-ecommerce-observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  # KSM không đọc log và không giữ dữ liệu; một replica là đủ cho node demo.
  name: kube-state-metrics
  namespace: bin-ecommerce-observability
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: bin-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/part-of: bin-ecommerce
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 15m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 160Mi
---
apiVersion: v1
kind: Service
metadata:
  # Endpoint nội bộ cho Prometheus, không public.
  name: kube-state-metrics
  namespace: bin-ecommerce-observability
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: bin-ecommerce
spec:
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - name: http
      port: 8080
      targetPort: http
