# Deployment và Service cho Auth Service.
# Auth Service dùng PostgreSQL cloud, Redis cloud, Kafka nội bộ và Keycloak nội bộ.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bin-ecommerce-auth-service
  namespace: bin-ecommerce-app
  labels:
    app.kubernetes.io/name: bin-ecommerce-auth-service
    app.kubernetes.io/part-of: bin-ecommerce
spec:
  # Một replica phù hợp với tài nguyên hiện tại của EC2.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bin-ecommerce-auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bin-ecommerce-auth-service
        app.kubernetes.io/part-of: bin-ecommerce
    spec:
      # Cho phép kubelet pull image private từ GHCR.
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: auth-service
          # Tag này là commit đã dùng để build/push Auth Service.
          image: ghcr.io/daongocanh25092004/bin-ecommerce-auth-service:c5aebdb5942a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
          env:
            # Auth Service dùng port 3002 theo Dockerfile và healthcheck.
            - name: PORT
              value: "3002"
            - name: NODE_ENV
              value: production
            # Mỗi service dùng database riêng trong PostgreSQL cloud.
            # Giá trị này không phải password nên có thể đặt trực tiếp trong manifest.
            - name: POSTGRES_DB
              value: bin_ecommerce_auth
            # Group ID ổn định để consumer auth không đọc trùng event sau restart.
            - name: KAFKA_GROUP_ID
              value: auth-service
          envFrom:
            # Chứa host/password PostgreSQL, Redis, client secret Keycloak và các secret khác.
            - secretRef:
                name: bin-ecommerce-runtime-secrets
            # ConfigMap đặt sau Secret để các URL nội bộ đúng với DNS Kubernetes
            # được ưu tiên hơn các giá trị local/Docker Compose trong .env.
            - configMapRef:
                name: bin-ecommerce-internal-services
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          readinessProbe:
            # Chỉ nhận traffic sau khi HTTP process đã lắng nghe.
            # Health endpoint của Auth có thể báo thiếu dependency trong response,
            # nhưng readiness vẫn xác nhận process còn phục vụ HTTP.
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            # Restart container nếu process bị treo lâu dài.
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 45
            timeoutSeconds: 5
            periodSeconds: 20
            failureThreshold: 3
---

apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: bin-ecommerce-app
  labels:
    app.kubernetes.io/name: bin-ecommerce-auth-service
    app.kubernetes.io/part-of: bin-ecommerce
spec:
  # Auth chỉ được gọi nội bộ bởi API Gateway và workload trong cluster.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bin-ecommerce-auth-service
  ports:
    - name: http
      port: 3002
      targetPort: http
      protocol: TCP
