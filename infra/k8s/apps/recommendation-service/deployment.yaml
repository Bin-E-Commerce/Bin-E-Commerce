# Recommendation Service xử lý recommendation, interaction và Kafka consumer.
# Readiness dùng /live ở giai đoạn đầu để dependency phụ trợ không chặn pod khởi động.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bin-ecommerce-recommendation-service
  namespace: bin-ecommerce-app
  labels:
    app.kubernetes.io/name: bin-ecommerce-recommendation-service
    app.kubernetes.io/part-of: bin-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bin-ecommerce-recommendation-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bin-ecommerce-recommendation-service
        app.kubernetes.io/part-of: bin-ecommerce
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: recommendation-service
          image: ghcr.io/daongocanh25092004/bin-ecommerce-recommendation-service:c5aebdb5942a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3006
          env:
            - name: PORT
              value: "3006"
            - name: NODE_ENV
              value: production
            - name: POSTGRES_DB
              value: bin_ecommerce_recommendation
            - name: KAFKA_CONSUMER_GROUP
              value: recommendation-interactions-v1
          envFrom:
            - secretRef:
                name: bin-ecommerce-runtime-secrets
            # Secret riêng cho token attribution; giá trị được tạo trực tiếp trên cluster.
            - secretRef:
                name: recommendation-service-secrets
            - configMapRef:
                name: bin-ecommerce-internal-services
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 20
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
  namespace: bin-ecommerce-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bin-ecommerce-recommendation-service
  ports:
    - name: http
      port: 3006
      targetPort: http
