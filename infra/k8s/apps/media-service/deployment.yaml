# Media Service quản lý presigned upload và asset media.
# Readiness dùng endpoint live để AWS/S3 tạm thời lỗi không làm pod bị loại khỏi cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bin-ecommerce-media-service
  namespace: bin-ecommerce-app
  labels:
    app.kubernetes.io/name: bin-ecommerce-media-service
    app.kubernetes.io/part-of: bin-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bin-ecommerce-media-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bin-ecommerce-media-service
        app.kubernetes.io/part-of: bin-ecommerce
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: media-service
          image: ghcr.io/daongocanh25092004/bin-ecommerce-media-service:c5aebdb5942a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3004
          env:
            - name: PORT
              value: "3004"
            - name: NODE_ENV
              value: production
          envFrom:
            - secretRef:
                name: bin-ecommerce-runtime-secrets
            - configMapRef:
                name: bin-ecommerce-internal-services
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 45
            timeoutSeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: media-service
  namespace: bin-ecommerce-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bin-ecommerce-media-service
  ports:
    - name: http
      port: 3004
      targetPort: http
