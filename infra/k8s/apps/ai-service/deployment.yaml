# AI Service cung cấp API FastAPI cho product content và image optimization.
# Service chỉ mở trong cluster; API Gateway gọi qua DNS ai-service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bin-ecommerce-ai-service
  namespace: bin-ecommerce-app
  labels:
    app.kubernetes.io/name: bin-ecommerce-ai-service
    app.kubernetes.io/part-of: bin-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bin-ecommerce-ai-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bin-ecommerce-ai-service
        app.kubernetes.io/part-of: bin-ecommerce
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: ai-service
          image: ghcr.io/daongocanh25092004/bin-ecommerce-ai-service:c5aebdb5942a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3009
          env:
            - name: PORT
              value: "3009"
            - name: NODE_ENV
              value: production
            - name: APP_NAME
              value: ai-service
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.bin-ecommerce-data.svc.cluster.local:9092
            # Image hiện tại chưa đóng gói artifacts/ranking.txt nên dùng fallback an toàn.
            # Khi có model đã train, thay giá trị này bằng /app/artifacts/ranking.txt
            # và build image có kèm artifact tương ứng.
            - name: RANKING_MODEL_PATH
              value: ""
            - name: RANKING_MODEL_VERSION
              value: ranking-fallback-v1
            # Ứng dụng FastAPI dùng tên chuẩn DATABASE_URL/REDIS_URL.
            # Secret runtime đang lưu hai giá trị này với tiền tố AI_ để phân biệt cấu hình.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bin-ecommerce-runtime-secrets
                  key: AI_DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: bin-ecommerce-runtime-secrets
                  key: AI_REDIS_URL
          envFrom:
            - secretRef:
                name: bin-ecommerce-runtime-secrets
            - configMapRef:
                name: bin-ecommerce-internal-services
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            timeoutSeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: bin-ecommerce-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bin-ecommerce-ai-service
  ports:
    - name: http
      port: 3009
      targetPort: http
