# Cart Service quản lý giỏ hàng và lưu dữ liệu vào PostgreSQL riêng.
# Port container là 3003 theo Dockerfile của service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bin-ecommerce-cart-service
  namespace: bin-ecommerce-app
  labels:
    app.kubernetes.io/name: bin-ecommerce-cart-service
    app.kubernetes.io/part-of: bin-ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bin-ecommerce-cart-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bin-ecommerce-cart-service
        app.kubernetes.io/part-of: bin-ecommerce
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: cart-service
          image: ghcr.io/daongocanh25092004/bin-ecommerce-cart-service:c5aebdb5942a
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3003
          env:
            - name: PORT
              value: "3003"
            - name: NODE_ENV
              value: production
            - name: POSTGRES_DB
              value: bin_ecommerce_cart
          envFrom:
            - secretRef:
                name: bin-ecommerce-runtime-secrets
            - configMapRef:
                name: bin-ecommerce-internal-services
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 15
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 45
            timeoutSeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: bin-ecommerce-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bin-ecommerce-cart-service
  ports:
    - name: http
      port: 3003
      targetPort: http
