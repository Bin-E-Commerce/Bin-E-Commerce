apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Đây là bundle hạ tầng dữ liệu. Không đưa bundle này vào deploy application
# tự động; chỉ dùng khi bootstrap hoặc nâng cấp Kafka/Keycloak có chủ đích.
resources:
  - ../../namespaces/namespaces.yaml
  - ../../data/kafka/kafka.yaml
  - ../../data/keycloak/keycloak.yaml
