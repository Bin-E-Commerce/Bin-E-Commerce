# ============================================================================
# Khởi động theo thứ tự:
#   1. docker compose --env-file infra/docker/.env -f infra/docker/docker-compose.infra.yml up -d
#   2. docker compose --env-file .env up -d --build
#
# File này chỉ chạy các thành phần hạ tầng dùng chung cho Bin E-Commerce.
# Application services được khai báo trong docker-compose.yml ở thư mục root.
# ============================================================================

# THÀNH PHẦN THAM GIA
#
# Hạ tầng dùng chung trong compose này:
#   Service       | Container port | Host port | Chức năng
#   PostgreSQL    | 5432           | 5432      | database cho các service nghiệp vụ
#   MongoDB       | 27017          | 27017     | database document cho notification
#   Redis         | 6379           | 6379      | cache, session, OTP và realtime state
#   Kafka         | 9092/29092     | 9092/29092| message broker cho event/worker
#   Keycloak      | 8080           | 8080      | xác thực và cấp token OAuth/OIDC
#   Qdrant        | 6333/6334      | 6333/6334 | vector database cho recommendation
#   Prometheus    | 9090           | 9090      | thu thập metrics
#   Grafana       | 3030           | 3030      | dashboard quan sát hệ thống
#   Kafka UI      | 8080           | 8081      | theo dõi topic và consumer group
#
# Database initializer là job chạy một lần sau khi PostgreSQL healthy; job này
# không mở port và chỉ đảm bảo các database nghiệp vụ đã tồn tại.
#
# Dừng an toàn, không xóa dữ liệu:
#   docker compose --env-file infra/docker/.env -f infra/docker/docker-compose.infra.yml stop
#
# Không dùng `down -v` hoặc `docker volume prune` nếu chưa có bản sao dữ liệu.
# ============================================================================

name: bin-ecommerce-infra

services:

  # --------------------------------------------------------------------------
  # 01. Database dùng chung
  # --------------------------------------------------------------------------

  # Service: PostgreSQL
  # Port: container 5432 -> host 5432
  # Vai trò: Lưu dữ liệu quan hệ cho các service và Keycloak.
  # Kết nối chính: Application services, db-init và Keycloak.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infra_net

  # Service: Database initializer
  # Port: Không có HTTP port
  # Vai trò: Tạo các database PostgreSQL cần thiết sau khi PostgreSQL healthy.
  # Kết nối chính: PostgreSQL.
  db-init:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: ${POSTGRES_USER}
      PGHOST: postgres
    command: >
      sh -c "
        for db in keycloak bin_ecommerce_auth bin_ecommerce_catalog bin_ecommerce_seller bin_ecommerce_product bin_ecommerce_cart bin_ecommerce_order bin_shipping bin_ecommerce_recommendation; do
        psql -tc \"SELECT 1 FROM pg_database WHERE datname = '$$db'\" | grep -q 1 ||
        psql -c \"CREATE DATABASE $$db\" || true;
        echo \"[db-init] $$db ensured\";
      done"
    networks:
      - infra_net

  # Service: MongoDB
  # Port: container 27017 -> host 27017
  # Vai trò: Lưu dữ liệu document cho các service dùng MongoDB.
  # Kết nối chính: Notification Service và các module document.
  mongodb:
    image: mongo:7-jammy
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: bin_ecommerce
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infra_net

  # Service: Redis
  # Port: container 6379 -> host 6379
  # Vai trò: Cache, session, OTP và realtime state; có bật xác thực bằng REDIS_PASSWORD.
  # Kết nối chính: API Gateway, Auth, Recommendation, AI và Notification.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in infra/docker/.env}
    command: >-
      sh -c 'exec redis-server --requirepass "$${REDIS_PASSWORD}" --maxmemory
      64mb --maxmemory-policy allkeys-lru'
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - infra_net

  # --------------------------------------------------------------------------
  # 02. Vector database
  # --------------------------------------------------------------------------

  # Service: Qdrant
  # Port: container 6333/6334 -> host 6333/6334
  # Vai trò: Lưu và truy vấn vector embedding cho semantic recommendation.
  # Kết nối chính: Recommendation Service và AI embedding pipeline.
  qdrant:
    image: qdrant/qdrant:v1.13.2
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - infra_net

  # --------------------------------------------------------------------------
  # 03. Message broker
  # --------------------------------------------------------------------------

  # Service: Kafka (KRaft)
  # Port: container 9092/29092 -> host 9092/29092
  # Vai trò: Truyền event bất đồng bộ giữa các service, không dùng ZooKeeper.
  # Kết nối chính: Producer/consumer của application services.
  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_RETENTION_HOURS: "24"
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      # Apache Kafka image hiện dùng /tmp/kafka-logs làm log.dirs thực tế.
      # Mount đúng thư mục này để topic và metadata không mất khi recreate container.
      - kafka_data:/tmp/kafka-logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - infra_net

  # Service: Kafka UI
  # Port: container 8080 -> host 8081
  # Vai trò: Theo dõi topic, consumer group và message Kafka trong local/demo.
  # Kết nối chính: Kafka.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: Local-Cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: host.docker.internal:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - infra_net
    depends_on:
      - kafka

  # --------------------------------------------------------------------------
  # 04. Identity và access management
  # --------------------------------------------------------------------------

  # Service: Keycloak
  # Port: container 8080 -> host 8080
  # Vai trò: Cung cấp realm, user identity và OAuth/OIDC cho authentication.
  # Kết nối chính: PostgreSQL và API Gateway/Auth Service.
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    command: start-dev
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      JAVA_OPTS_APPEND: "-Xmx256m -Xms128m"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/8080 2>/dev/null && echo -ne 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && timeout 3 cat <&3 | grep -q '\"status\":\"UP\"'",
        ]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - infra_net

  # --------------------------------------------------------------------------
  # 05. Observability
  # --------------------------------------------------------------------------

  # Service: Prometheus
  # Port: container 9090 -> host 9090
  # Vai trò: Thu thập và lưu time-series metrics của hệ thống.
  # Kết nối chính: Prometheus configuration và các metrics endpoint.
  prometheus:
    image: prom/prometheus:v2.51.2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ../../infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - infra_net

  # Service: Grafana
  # Port: container 3030 -> host 3030
  # Vai trò: Hiển thị dashboard metrics và health của hệ thống.
  # Kết nối chính: Prometheus datasource và Grafana provisioning.
  grafana:
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: "3030"
    ports:
      - "3030:3030"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - infra_net

# --------------------------------------------------------------------------
# Volumes - dữ liệu bền vững
# --------------------------------------------------------------------------
volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:
  qdrant_data:
    # Giữ lại volume vector cũ để không mất dữ liệu khi chuyển Qdrant sang infra Compose.
    name: e-commerce_qdrant_data

# --------------------------------------------------------------------------
# Network - mạng nội bộ cho toàn bộ infra services
# --------------------------------------------------------------------------
networks:
  infra_net:
    name: bin_infra_net
    driver: bridge
