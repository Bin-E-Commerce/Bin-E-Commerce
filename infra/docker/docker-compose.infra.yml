# ============================================================================
# Khởi động theo thứ tự:
#   1. docker compose --env-file infra/docker/.env --env-file .env -f infra/docker/docker-compose.infra.yml up -d
#   2. docker compose --env-file .env up -d --build
#
# File này chỉ chạy các thành phần hạ tầng dùng chung cho Bin E-Commerce.
# Application services được khai báo trong docker-compose.yml ở thư mục root.
# ============================================================================

# THÀNH PHẦN THAM GIA
#
# Hạ tầng dùng chung trong compose này:
#   Service       | Container port | Host port | Chức năng
#   Kafka         | 9092/29092     | 9092/29092| message broker cho event/worker
#   Keycloak      | 8080           | 8080      | xác thực và cấp token OAuth/OIDC
#   Prometheus    | 9090           | 9090      | thu thập metrics
#   Grafana       | 3030           | 3030      | dashboard quan sát hệ thống
#   Kafka UI      | 8080           | 8081      | theo dõi topic và consumer group
#
# PostgreSQL, MongoDB, Redis và Qdrant là dịch vụ managed cloud; application
# services nhận endpoint từ root .env. Compose này chỉ giữ runtime local và
# observability nên không tạo database container hoặc database volume.
#
# Dừng an toàn, không xóa dữ liệu:
#   docker compose --env-file infra/docker/.env --env-file .env -f infra/docker/docker-compose.infra.yml stop
#
# Không dùng `down -v` hoặc `docker volume prune` nếu chưa có bản sao dữ liệu.
# ============================================================================

name: bin-ecommerce-infra

services:
  # --------------------------------------------------------------------------
  # 01. Message broker
  # --------------------------------------------------------------------------

  # Service: Kafka (KRaft)
  # Port: container 9092/29092 -> host 9092/29092
  # Vai trò: Truyền event bất đồng bộ giữa các service, không dùng ZooKeeper.
  # Kết nối chính: Producer/consumer của application services.
  kafka:
    container_name: bin-ecommerce-infra-kafka
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_RETENTION_HOURS: "24"
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      # Apache Kafka image hiện dùng /tmp/kafka-logs làm log.dirs thực tế.
      # Mount đúng thư mục này để topic và metadata không mất khi recreate container.
      - kafka_data:/tmp/kafka-logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - infra_net

  # Service: Kafka UI
  # Port: container 8080 -> host 8081
  # Vai trò: Theo dõi topic, consumer group và message Kafka trong local/demo.
  # Kết nối chính: Kafka.
  kafka-ui:
    container_name: bin-ecommerce-infra-kafka-ui
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: Bin-Ecommerce-Local-Kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - infra_net
    depends_on:
      - kafka

  # --------------------------------------------------------------------------
  # 02. Identity và access management
  # --------------------------------------------------------------------------

  # Service: PostgreSQL local cho Keycloak
  # Port: chỉ mở trong Docker network, không publish ra host
  # Vai trò: lưu realm, client, user và session local; không dùng database production.
  keycloak-db:
    container_name: bin-ecommerce-infra-keycloak-db-local
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_LOCAL_DB_NAME:-bin_ecommerce_auth_local}
      POSTGRES_USER: ${KEYCLOAK_LOCAL_DB_USER:-keycloak_local}
      POSTGRES_PASSWORD: ${KEYCLOAK_LOCAL_DB_PASSWORD:-local-keycloak-db-password}
    volumes:
      - bin_ecommerce_keycloak_local_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${KEYCLOAK_LOCAL_DB_USER:-keycloak_local} -d ${KEYCLOAK_LOCAL_DB_NAME:-bin_ecommerce_auth_local}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - infra_net

  # Service: Keycloak
  # Port: container 8080 -> host 8080
  # Vai trò: Cung cấp realm, user identity và OAuth/OIDC cho authentication.
  # Kết nối chính: PostgreSQL và API Gateway/Auth Service.
  keycloak:
    container_name: bin-ecommerce-infra-keycloak
    image: quay.io/keycloak/keycloak:24.0
    restart: unless-stopped
    command: start-dev --import-realm
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_LOCAL_DB_NAME:-bin_ecommerce_auth_local}
      KC_DB_USERNAME: ${KEYCLOAK_LOCAL_DB_USER:-keycloak_local}
      KC_DB_PASSWORD: ${KEYCLOAK_LOCAL_DB_PASSWORD:-local-keycloak-db-password}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:?Set KEYCLOAK_ADMIN_USER in infra/docker/.env}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in infra/docker/.env}
      JAVA_OPTS_APPEND: "-Xmx256m -Xms128m"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      # Realm export khôi phục client, role và cấu hình OIDC sau khi reset Keycloak.
      - ../keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # Keycloak 24 chạy HTTP ở 8080; health endpoint không nằm trên port này
      # trong profile start-dev, nên kiểm tra TCP để tránh báo unhealthy giả.
      test: ["CMD-SHELL", "(echo > /dev/tcp/localhost/8080) >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - infra_net

  # --------------------------------------------------------------------------
  # 03. Observability
  # --------------------------------------------------------------------------

  # Service: Prometheus
  # Port: container 9090 -> host 9090
  # Vai trò: Thu thập và lưu time-series metrics của hệ thống.
  # Kết nối chính: Prometheus configuration và các metrics endpoint.
  prometheus:
    container_name: bin-ecommerce-infra-prometheus
    image: prom/prometheus:v2.51.2
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ../../infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - infra_net

  # Service: Grafana
  # Port: container 3030 -> host 3030
  # Vai trò: Hiển thị dashboard metrics và health của hệ thống.
  # Kết nối chính: Prometheus datasource và Grafana provisioning.
  grafana:
    container_name: bin-ecommerce-infra-grafana
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: "3030"
    ports:
      - "3030:3030"
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - infra_net

# --------------------------------------------------------------------------
# Volumes - dữ liệu bền vững
# --------------------------------------------------------------------------
volumes:
  kafka_data:
  prometheus_data:
  grafana_data:
  # Volume local riêng cho Keycloak; không dùng chung với production.
  bin_ecommerce_keycloak_local_data:
    name: bin-ecommerce-keycloak-local-data

# --------------------------------------------------------------------------
# Network - mạng nội bộ cho toàn bộ infra services
# --------------------------------------------------------------------------
networks:
  infra_net:
    name: bin_infra_net
    driver: bridge
