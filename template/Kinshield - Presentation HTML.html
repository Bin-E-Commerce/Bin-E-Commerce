<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KinShield Flow — System Design Chống Lừa Đảo Ba Lớp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
  <style>
    /* ==========================================================================
       KinShield Flow — Calm Animated Models Design System (SysMotion Style)
       Warm Cream + Eucalyptus Sage (Light) / Soft Dusk Everforest (Dark)
       ========================================================================== */
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg: #f6f4ee;
      --bg-subtle: #edeae0;
      --surface: #ffffff;
      --surface-warm: #faf8f3;
      --canvas-bg: #fcfbf8;
      --border: #e4dfd3;
      --border-strong: #d3ccb9;

      --text: #1f2933;
      --text-secondary: #52606d;
      --text-muted: #7b8794;

      --accent: #2a7b6f;
      --accent-hover: #216359;
      --accent-soft: #e6f3f0;
      --accent-border: #bfe0d8;

      --producer: #b86a3a;
      --producer-bg: #fdf2ea;
      --producer-border: #efcfae;

      --broker: #2a7b6f;
      --broker-bg: #e7f4f1;
      --broker-border: #b8ded5;

      --consumer: #5363b5;
      --consumer-bg: #eef0fa;
      --consumer-border: #cbd3f1;

      --kraft: #7c5c91;
      --kraft-bg: #f4eff8;
      --kraft-border: #dccce8;

      --good: #2f7d54;
      --good-bg: #e8f5ed;
      --good-border: #bae0c9;

      --warn: #b57724;
      --warn-bg: #fdf5e7;
      --warn-border: #ecd5ac;

      --danger: #bf4e4e;
      --danger-bg: #fcecec;
      --danger-border: #ecc3c3;

      --wire: #cfc8b8;
      --wire-active: #2a7b6f;

      --shadow-sm: 0 2px 6px rgba(45, 42, 34, 0.04);
      --shadow-md: 0 10px 28px rgba(45, 42, 34, 0.06);

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --radius-pill: 999px;

      --font-ui: "Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-mono-ui: "JetBrains Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
      color-scheme: light;
    }

    [data-theme="dark"] {
      --bg: #1a2025;
      --bg-subtle: #21282f;
      --surface: #242d35;
      --surface-warm: #29333c;
      --canvas-bg: #1f272e;
      --border: #35414c;
      --border-strong: #465563;

      --text: #e9e6de;
      --text-secondary: #adb7c0;
      --text-muted: #7f8c97;

      --accent: #68b8a8;
      --accent-hover: #7ec8b9;
      --accent-soft: #1f3634;
      --accent-border: #335854;

      --producer: #e09c6d;
      --producer-bg: #36281f;
      --producer-border: #593f2e;

      --broker: #68b8a8;
      --broker-bg: #1e3533;
      --broker-border: #335955;

      --consumer: #9aa7ea;
      --consumer-bg: #252a42;
      --consumer-border: #3c446b;

      --kraft: #c3a4db;
      --kraft-bg: #30253a;
      --kraft-border: #4e3c5e;

      --good: #7bc79a;
      --good-bg: #1e3428;
      --good-border: #315742;

      --warn: #e2b167;
      --warn-bg: #382f1e;
      --warn-border: #5b4b2e;

      --danger: #e48484;
      --danger-bg: #3b2325;
      --danger-border: #61383b;

      --wire: #465460;
      --wire-active: #68b8a8;

      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.22);
      --shadow-md: 0 12px 32px rgba(0, 0, 0, 0.3);
      color-scheme: dark;
    }

    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 15px;
      line-height: 1.58;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background:
        radial-gradient(circle at 12% 10%, rgba(42, 123, 111, 0.065), transparent 36%),
        radial-gradient(circle at 88% 12%, rgba(184, 106, 58, 0.05), transparent 34%),
        radial-gradient(circle at 75% 86%, rgba(83, 99, 181, 0.05), transparent 38%);
    }
    button { font-family: inherit; font-size: inherit; color: inherit; }
    code {
      font-family: var(--font-mono-ui);
      font-size: 0.88em;
      background: var(--bg-subtle);
      padding: 1px 6px;
      border-radius: 5px;
    }

    /* Sticky Topbar */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      max-width: 1420px; margin: 0 auto; padding: 11px 22px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 14px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--accent); display: grid; place-items: center;
      box-shadow: 0 3px 10px color-mix(in srgb, var(--accent) 26%, transparent);
    }
    .brand-title { font-weight: 800; font-size: 16px; letter-spacing: -0.02em; line-height: 1.15; }
    .brand-sub { font-size: 11.5px; color: var(--text-muted); font-weight: 500; }

    .global-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pill-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 13px; border-radius: var(--radius-pill);
      border: 1px solid var(--border-strong);
      background: var(--surface); color: var(--text-secondary);
      font-size: 12.5px; font-weight: 600; cursor: pointer;
      transition: all 0.15s ease;
    }
    .pill-btn:hover { background: var(--surface-warm); color: var(--text); }
    .pill-btn.active { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); }

    .deck-progress-track { height: 3px; background: var(--border); width: 100%; overflow: hidden; }
    .deck-progress-fill { height: 100%; background: var(--accent); transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1); }

    /* Workspace 2-column layout */
    .workspace-shell {
      max-width: 1420px; margin: 0 auto; padding: 20px 22px 48px;
      display: grid; grid-template-columns: 274px minmax(0, 1fr);
      gap: 22px; align-items: start;
    }

    /* Sticky Left Sidebar */
    .side-menu {
      position: sticky; top: 76px;
      max-height: calc(100dvh - 94px); overflow-y: auto;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 12px;
      box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column; gap: 12px;
    }
    .side-cover {
      border-radius: var(--radius-md); padding: 14px 14px 12px;
      border: 1px solid var(--accent-border);
      background: linear-gradient(135deg, var(--accent-soft), var(--surface-warm));
      display: flex; flex-direction: column; gap: 6px;
    }
    .side-cover-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .side-cover-title { font-size: 14px; font-weight: 800; color: var(--text); letter-spacing: -0.01em; }
    .side-cover-count {
      font-family: var(--font-mono-ui); font-size: 10.5px; font-weight: 700;
      color: #ffffff; background: var(--accent); padding: 2px 8px; border-radius: 99px;
    }
    [data-theme="dark"] .side-cover-count { color: #10201d; }
    .side-cover-sub { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }

    .side-menu-group { display: flex; flex-direction: column; gap: 3px; }
    .side-menu-heading {
      font-size: 10.5px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--text-muted); padding: 2px 10px 4px;
    }
    .side-menu-item {
      width: 100%; border: 1px solid transparent; background: transparent;
      padding: 8px 10px; border-radius: var(--radius-sm);
      display: flex; align-items: center; gap: 9px; text-align: left;
      cursor: pointer; color: var(--text-secondary);
      font-size: 13px; font-weight: 600; line-height: 1.3;
      transition: all 0.14s ease;
    }
    .side-menu-item:hover { background: var(--surface-warm); color: var(--text); }
    .side-menu-item.active { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent); }
    .side-menu-num {
      width: 24px; height: 24px; border-radius: 7px;
      background: var(--bg-subtle); color: var(--text-muted);
      font-family: var(--font-mono-ui); font-size: 11px; font-weight: 700;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .side-menu-item.active .side-menu-num { background: var(--accent); color: #ffffff; }
    [data-theme="dark"] .side-menu-item.active .side-menu-num { color: #10201d; }

    /* Stage Card */
    .stage-column { min-width: 0; }
    .model-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
      overflow: hidden;
      animation: slideFadeIn 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes slideFadeIn {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .model-header {
      padding: 20px 26px 16px; border-bottom: 1px solid var(--border);
      background: var(--surface-warm);
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 16px; flex-wrap: wrap;
    }
    .model-title-group { display: flex; flex-direction: column; gap: 6px; max-width: 650px; }
    .model-badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: var(--radius-pill);
      font-size: 11.5px; font-weight: 700;
      border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary);
    }
    .badge.producer { background: var(--producer-bg); color: var(--producer); border-color: var(--producer-border); }
    .badge.broker { background: var(--broker-bg); color: var(--broker); border-color: var(--broker-border); }
    .badge.consumer { background: var(--consumer-bg); color: var(--consumer); border-color: var(--consumer-border); }
    .badge.kraft { background: var(--kraft-bg); color: var(--kraft); border-color: var(--kraft-border); }
    .badge.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger-border); }
    .badge.good { background: var(--good-bg); color: var(--good); border-color: var(--good-border); }
    .badge.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-border); }

    .model-header h2 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.28; }
    .model-subtitle { margin: 0; color: var(--text-secondary); font-size: 13.8px; }

    .model-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .ctrl-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 13px; border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
      font-size: 12.8px; font-weight: 600; cursor: pointer;
      transition: all 0.15s ease; white-space: nowrap;
    }
    .ctrl-btn:hover { background: var(--bg-subtle); transform: translateY(-1px); }
    .ctrl-btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
    .ctrl-btn.danger { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger); }
    .ctrl-btn.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn); }
    .ctrl-btn.good { background: var(--good-bg); border-color: var(--good-border); color: var(--good); }

    .stage-canvas-wrap {
      padding: 18px 22px; background: var(--canvas-bg);
      position: relative; overflow-x: auto;
    }
    .stage-svg {
      width: 100%; min-width: 780px; height: auto;
      display: block; margin: 0 auto; user-select: none;
    }

    .status-banner {
      margin: 0 22px 16px; padding: 10px 14px; border-radius: var(--radius-sm);
      border: 1px solid var(--border); background: var(--surface-warm);
      font-size: 13px; color: var(--text-secondary);
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
    }
    .status-banner.danger { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger); }
    .status-banner.good { background: var(--good-bg); border-color: var(--good-border); color: var(--good); }
    .status-banner.warn { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn); }
    .status-metric { font-family: var(--font-mono-ui); font-weight: 700; }

    .model-takeaways {
      padding: 16px 26px 20px; border-top: 1px solid var(--border);
      background: var(--surface);
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
    }
    .takeaway-item {
      background: var(--surface-warm); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 12px 14px;
    }
    .takeaway-item strong { display: block; font-size: 13px; margin-bottom: 3px; color: var(--text); }
    .takeaway-item span { font-size: 12.5px; color: var(--text-secondary); line-height: 1.46; display: block; }

    /* Compact Scenario Detail + Matrix (Model 02) */
    .sc-detail-grid {
      margin: 0 22px 14px;
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;
    }
    .sc-detail-box {
      background: var(--surface-warm); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 10px 13px;
    }
    .sc-detail-box .sc-lbl {
      display: block; font-size: 10.5px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--text-muted); margin-bottom: 3px;
    }
    .sc-detail-box .sc-val { font-size: 12.6px; color: var(--text); line-height: 1.45; }
    .sc-detail-box.hit { border-color: var(--good-border); background: var(--good-bg); }
    .sc-detail-box.hit .sc-lbl { color: var(--good); }
    .sc-detail-box.atk { border-color: var(--danger-border); background: var(--danger-bg); }
    .sc-detail-box.atk .sc-lbl { color: var(--danger); }

    .layer-matrix-wrap { padding: 0 22px 16px; overflow-x: auto; }
    .layer-matrix {
      width: 100%; border-collapse: collapse; font-size: 12.5px;
      border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden;
      background: var(--surface);
    }
    .layer-matrix th, .layer-matrix td {
      padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border);
    }
    .layer-matrix th {
      background: var(--surface-warm); color: var(--text-muted);
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 700;
    }
    .layer-matrix tbody tr { cursor: pointer; transition: background 0.14s ease; }
    .layer-matrix tbody tr:hover { background: var(--surface-warm); }
    .layer-matrix tr:last-child td { border-bottom: 0; }
    .layer-matrix tr.row-active { background: var(--accent-soft); }
    .layer-matrix tr.row-active td:first-child { color: var(--accent); font-weight: 700; }
    .hit-pill {
      display: inline-block; padding: 2px 8px; border-radius: 99px;
      font-size: 11px; font-weight: 700; white-space: nowrap;
    }
    .hit-pill.primary { background: var(--good-bg); color: var(--good); border: 1px solid var(--good-border); }
    .hit-pill.support { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-border); }
    .hit-pill.idle { background: var(--bg-subtle); color: var(--text-muted); }
    @media (max-width: 820px) { .sc-detail-grid { grid-template-columns: 1fr; } }

    /* Bottom Pagination */
    .deck-pagination {
      margin-top: 18px; padding: 15px 20px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
      display: flex; align-items: center; justify-content: space-between;
      gap: 14px; flex-wrap: wrap;
    }
    .pager-btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 10px 16px; border-radius: var(--radius-md);
      border: 1px solid var(--border-strong); background: var(--surface-warm); color: var(--text);
      cursor: pointer; transition: all 0.16s ease; text-align: left; min-width: 200px;
    }
    .pager-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); transform: translateY(-1px); }
    .pager-btn.next { background: var(--accent); border-color: var(--accent); color: #ffffff; justify-content: space-between; text-align: right; }
    .pager-btn.next:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
    [data-theme="dark"] .pager-btn.next { color: #10201d; }
    .pager-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .pager-btn-meta { display: flex; flex-direction: column; line-height: 1.25; }
    .pager-btn-dir { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.78; }
    .pager-btn-name { font-size: 13px; font-weight: 700; }

    .pager-center { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .pager-counter { font-family: var(--font-mono-ui); font-size: 12.5px; font-weight: 700; color: var(--text); }
    .pager-dots { display: flex; align-items: center; gap: 7px; }
    .pager-dot { width: 9px; height: 9px; border-radius: 99px; border: none; padding: 0; background: var(--border-strong); cursor: pointer; transition: all 0.2s ease; }
    .pager-dot.active { width: 26px; background: var(--accent); }
    .pager-hint { font-size: 11px; color: var(--text-muted); }

    /* SVG Node Typography */
    .n-title { fill: var(--text); font-size: 13px; font-weight: 700; }
    .n-sub { fill: var(--text-secondary); font-size: 11px; font-weight: 500; }
    .n-mono { fill: var(--text-muted); font-size: 10.5px; font-family: var(--font-mono-ui); font-weight: 600; }
    .n-wire-lbl { fill: var(--text-secondary); font-size: 11px; font-weight: 600; }

    /* Technical Reference Repos Table */
    .ref-repo-box {
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      overflow: hidden;
    }
    .ref-repo-head {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 14px;
      background: var(--surface-warm);
      border-bottom: 1px solid var(--border);
      font-size: 12px; font-weight: 700; color: var(--text);
    }
    .ref-repo-head span { font-size: 11px; font-weight: 600; color: var(--text-muted); font-family: var(--font-mono-ui); }
    .ref-repo-table { width: 100%; border-collapse: collapse; font-size: 12.2px; }
    .ref-repo-table th {
      text-align: left; padding: 7px 12px; font-size: 10.5px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);
      border-bottom: 1px solid var(--border); background: var(--surface-alt);
    }
    .ref-repo-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); color: var(--text-secondary); vertical-align: top; line-height: 1.45; }
    .ref-repo-table tr:last-child td { border-bottom: none; }
    .ref-link {
      color: var(--accent); font-family: var(--font-mono-ui); font-size: 11.8px; font-weight: 600;
      text-decoration: none; word-break: break-word;
    }
    .ref-link:hover { text-decoration: underline; }


    .verdict-pill {
      display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 999px;
      font-size: 10.5px; font-weight: 700; white-space: nowrap;
    }
    .verdict-pill.primary { background: var(--good-bg); color: var(--good); }
    .verdict-pill.support { background: var(--broker-bg); color: var(--broker); }
    .verdict-pill.warn { background: var(--warn-bg); color: var(--warn); }
    .verdict-pill.idle { background: var(--surface-warm); color: var(--text-muted); }
    .copy-pull-box {
      margin-top: 14px; border: 1px solid var(--border-strong); border-radius: var(--radius-md);
      background: var(--surface); overflow: hidden;
    }
    .copy-pull-head {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 14px; background: var(--surface-warm); border-bottom: 1px solid var(--border);
    }
    .copy-pull-title { font-size: 12.5px; font-weight: 700; color: var(--text); }
    .copy-pull-sub { font-size: 11px; color: var(--text-muted); font-family: var(--font-mono-ui); }
    .copy-pull-btn {
      font: inherit; font-size: 12px; font-weight: 700; padding: 7px 14px; border-radius: 999px;
      border: 1px solid var(--accent); background: var(--accent); color: #ffffff; cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    .copy-pull-btn:hover { opacity: 0.92; }
    .copy-pull-btn.copied { background: var(--good); border-color: var(--good); }
    .copy-pull-area {
      width: 100%; min-height: 220px; max-height: 360px; padding: 12px 14px; border: none; outline: none;
      resize: vertical; background: var(--canvas-bg); color: var(--text);

            svgBox(850, 96, 254, 112, "--surface-warm", "--good", "CHỐT CHIẾN LƯỢC", "1. Chạy mượt trên Expo Go", "2. Build 1 .apk EAS ăn điểm");

          const filtered = mode === "all" ? ALL_58_REPOS : ALL_58_REPOS.filter(function (r) { return r.grp === mode; });
          const modeTitleMap = {
            all: "Tất cả 58 Repository đã pull & kiểm tra code thật (ưu tiên React Native lên đầu)",
            rn: "21 Module & Native Hook cho React Native / Expo 58",
            apps: "13 Ứng dụng Mobile Chống Lừa Đảo, CallShield & Elder Guardian",
            l1: "14 Repo Lớp 1 (VietQR · Chống Lừa Đảo VN · URL Phishing · Quishing · Soi Bill ELA)",
            l2: "10 Repo Lớp 2 (Cuộc gọi lừa đảo Realtime · Tâm lý · DeepVoice Audio)"
          };

          banner = {
            tone: "good",
            text: "Đánh giá kỹ trên kinshield-mobile (Expo 58 / RN 0.88): Cả 3 lớp đều làm được! Chọn đúng module 2026 (expo-share-intent v9, expo-speech-recognition v58, nitro-call-detector) và né 5 lib cũ 2021–2023.",
            metric: "HIỂN THỊ " + filtered.length + " / 58 REPO"
          };

          const escapedScript = PULL_ALL_SCRIPT.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
          extraHtml =
            '<div class="sc-detail-grid">' +
              '<div class="sc-detail-box hit"><span class="sc-lbl">1. Đánh giá Lớp 1 trên React Native (98%)</span><div class="sc-val"><strong>Làm rất ngon:</strong> <code>expo-share-intent v9</code> khớp chính xác Expo 58; <code>viet-qr</code> parse VietQR offline &lt;2ms. <em>Bonus học từ ElderBridge &amp; SecurityChecker:</em> che CCCD/OTP trước khi gửi AI &amp; phát hiện app VNeID .apk bật Accessibility.</div></div>' +
              '<div class="sc-detail-box"><span class="sc-lbl">2. Đánh giá Lớp 2 trên React Native (90%)</span><div class="sc-val"><strong>Làm được với loa ngoài:</strong> <code>expo-speech-recognition v58</code> (vi-VN) + <code>nitro-call-detector</code> (manifest rỗng sạch Play Store). <em>Cảnh báo kỹ thuật:</em> khi gọi GSM thật, iOS khóa micro độc quyền → demo loa ngoài 2 máy + đường dài nối VoIP/nhà mạng cho RawNet3.</div></div>' +
              '<div class="sc-detail-box hit"><span class="sc-lbl">3. Đánh giá Lớp 3 trên React Native (100% USP)</span><div class="sc-val"><strong>Hoàn toàn khả thi &amp; Độc nhất:</strong> Chạy mượt 100% ngay trên Expo Go (Socket.IO + Redis 180s). Trong 58 repo đã pull (kể cả Elder-Guard, CallShield, VoxGuard), <strong>chưa repo nào có Family Co-Sign 180s + Privacy tách 2 kênh</strong>!</div></div>' +
            '</div>' +
            '<div class="copy-pull-box">' +
              '<div class="copy-pull-head">' +
                '<div><div class="copy-pull-title">Plain-Text Copy · Pull toàn bộ 58 Repo GitHub (1 lệnh chạy ngay)</div><div class="copy-pull-sub">Tương thích PowerShell, Git Bash, macOS &amp; Linux · Đã kiểm chứng 58/58 repo sống 100%</div></div>' +
                '<button type="button" class="copy-pull-btn" id="btnCopyPull58" data-copy-pull="1">Copy toàn bộ 58 lệnh pull</button>' +
              '</div>' +
              '<textarea id="pullAll58Text" class="copy-pull-area" readonly spellcheck="false">' + escapedScript + '</textarea>' +
            '</div>' +
            '<div class="ref-repo-box">' +
              '<div class="ref-repo-head">' +
                '<div>' + modeTitleMap[mode] + '</div>' +
                '<span>' + filtered.length + ' / 58 repo · Local: C:/LE/momo-antiscam-repos/</span>' +
              '</div>' +
              '<table class="ref-repo-table">' +
                '<thead><tr><th style="width:27%">Repository (GitHub)</th><th style="width:13%">Nhóm</th><th style="width:11%">Cập nhật · Lic</th><th style="width:16%">Đánh giá RN/Expo 58</th><th>Phân tích áp dụng cho 3 Lớp</th></tr></thead>' +
                '<tbody>' +
                filtered.map(function (it, idx) {
                  return '<tr>' +
                    '<td><strong style="color:var(--text-muted);font-family:var(--font-mono-ui);margin-right:5px;">' + String(idx + 1).padStart(2, "0") + '.</strong><a class="ref-link" href="' + it.url + '" target="_blank" rel="noopener noreferrer">' + it.slug + '</a></td>' +
                    '<td><span class="hit-pill support">' + it.layer + '</span></td>' +
                    '<td style="font-family:var(--font-mono-ui);font-size:11px;white-space:nowrap;">' + it.date + '<br><span style="color:var(--text-muted);">' + it.lic + '</span></td>' +
                    '<td><span class="verdict-pill ' + it.vc + '">' + it.v + '</span></td>' +
                    '<td>' + it.note + '</td>' +
                  '</tr>';
                }).join("") +
                '</tbody></table></div>';
        }

        // Build Arrowhead Markers + Clean Wires + Top Labels Layer
        const markerColors = ["--wire", "--accent", "--broker", "--producer", "--kraft", "--consumer", "--good", "--warn", "--danger"];
        const defsSvg = "<defs>" + markerColors.map(function (mc) {
          const id = "arr-" + mc.replace("--", "");
          return '<marker id="' + id + '" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="var(' + mc + ')"/></marker>';
        }).join("") + "</defs>";

        let wiresSvg = "";
        let labelsSvg = "";
        wires.forEach(function (w) {
          const d = curveD(w.c);
          const mId = "arr-" + w.color.replace("--", "");
          wiresSvg += '<path d="' + d + '" fill="none" stroke="var(' + w.color + ')" stroke-width="2.4" stroke-linecap="round"' + (w.dashed ? ' stroke-dasharray="6 5"' : '') + ' marker-end="url(#' + mId + ')" opacity="0.85"/>';
          if (w.label) {
            const mid = sampleCurve(w.c, 0.5);
            const lx = mid.x + (w.dx || 0);
            const ly = mid.y + (w.dy !== undefined ? w.dy : 4);
            const anchor = w.anchor || "middle";
            const tw = w.label.length * 6.4 + 14;
            const rx = anchor === "end" ? lx - tw + 4 : anchor === "start" ? lx - 4 : lx - tw / 2;
            labelsSvg +=
              '<g>' +
                '<rect x="' + rx.toFixed(1) + '" y="' + (ly - 12).toFixed(1) + '" width="' + tw.toFixed(1) + '" height="17" rx="5" fill="var(--canvas-bg)" opacity="0.92"/>' +
                '<text x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="' + anchor + '" class="n-wire-lbl">' + w.label + '</text>' +
              '</g>';
          }
        });

        const svgHtml =
          '<svg class="stage-svg" viewBox="0 0 1120 350" role="img" aria-label="Sơ đồ hoạt ảnh KinShield">' +
            defsSvg +
            '<g class="wires-layer">' + wiresSvg + '</g>' +
            '<g class="nodes-layer">' + nodes + '</g>' +
            '<g class="labels-layer">' + labelsSvg + '</g>' +
            '<g id="packetsLayer"></g>' +
          '</svg>';

        return { svgHtml: svgHtml, tracks: tracks, banner: banner, extraHtml: extraHtml };
      }

      // Animation Engine (requestAnimationFrame moving SVG packets along Bezier curves)
      let activeTracks = [];
      let activePackets = [];
      let rafId = null;
      let lastTs = 0;

      function initPackets(tracks) {
        activeTracks = tracks;
        activePackets = [];
        tracks.forEach(function (tr, ti) {
          const n = tr.count || 1;
          for (let i = 0; i < n; i++) {
            activePackets.push({
              ti: ti,
              t: ((tr.phase || 0) + i / n) % 1,
              dir: 1
            });
          }
        });
        renderPackets();
      }

      function renderPackets() {
        const layer = document.getElementById("packetsLayer");
        if (!layer) return;
        let out = "";
        for (let i = 0; i < activePackets.length; i++) {
          const p = activePackets[i];
          const tr = activeTracks[p.ti];
          if (!tr) continue;
          const pt = sampleCurve(tr.c, p.t);
          const lbl = tr.label || "";
          const rw = Math.max(22, lbl.length * 6 + 10);
          out +=
            '<g transform="translate(' + pt.x.toFixed(1) + ',' + pt.y.toFixed(1) + ')">' +
              '<rect x="' + (-rw/2).toFixed(1) + '" y="-9" width="' + rw.toFixed(1) + '" height="18" rx="9" fill="var(' + tr.color + ')" stroke="var(--canvas-bg)" stroke-width="2"/>' +
              '<text x="0" y="3" text-anchor="middle" fill="#ffffff" font-size="8.8" font-weight="700" font-family="JetBrains Mono, monospace">' + lbl + '</text>' +
            '</g>';
        }
        layer.innerHTML = out;
      }

      function tick(ts) {
        if (!lastTs) lastTs = ts;
        const dt = Math.min(0.05, (ts - lastTs) / 1000);
        lastTs = ts;
        if (running && activePackets.length) {
          for (let i = 0; i < activePackets.length; i++) {
            const p = activePackets[i];
            const tr = activeTracks[p.ti];
            if (!tr) continue;
            const rate = (tr.rate || 0.45) * speed;
            if (tr.bounceAt) {
              p.t += dt * rate * p.dir;
              if (p.t >= tr.bounceAt) { p.t = tr.bounceAt; p.dir = -1; }
              if (p.t <= 0.04) { p.t = 0.04; p.dir = 1; }
            } else {
              p.t = (p.t + dt * rate) % 1;
            }
          }
          renderPackets();
        }
        rafId = window.requestAnimationFrame(tick);
      }

      // Render Sidebar, Stage Card & Pagination
      function renderSidebar() {
        const el = document.getElementById("sideMenu");
        let html =
          '<div class="side-cover">' +
            '<div class="side-cover-top">' +
              '<span class="side-cover-title">KinShield Design</span>' +
              '<span class="side-cover-count">' + STEPS.length + ' trang</span>' +
            '</div>' +
            '<div class="side-cover-sub">Vấn đề → Giải pháp → Mô hình chung → Kỹ thuật</div>' +
          '</div>';

        GROUPS.forEach(function (gName) {
          html += '<div class="side-menu-group"><div class="side-menu-heading">' + gName + '</div>';
          STEPS.forEach(function (st, idx) {
            if (st.group !== gName) return;
            html +=
              '<button type="button" class="side-menu-item ' + (idx === pageIdx ? "active" : "") + '" data-idx="' + idx + '">' +
                '<span class="side-menu-num">' + st.num + '</span>' +
                '<span>' + st.label + '</span>' +
              '</button>';
          });
          html += '</div>';
        });
        el.innerHTML = html;
      }

      function renderStage() {
        const st = STEPS[pageIdx];
        const activeMode = modeByStep[st.num];
        const scene = buildScene(pageIdx, activeMode);

        const controlsHtml = st.modes.map(function (m) {
          const isAct = m.id === activeMode;
          return '<button type="button" class="ctrl-btn ' + (isAct ? m.cls : "") + '" data-mode="' + m.id + '">' + m.label + '</button>';
        }).join("");

        const takeawaysHtml = st.takeaways.map(function (t) {
          return '<div class="takeaway-item"><strong>' + t.title + '</strong><span>' + t.desc + '</span></div>';
        }).join("");

        const bannerCls = scene.banner.tone && scene.banner.tone !== "default" ? " " + scene.banner.tone : "";

        document.getElementById("modelStage").innerHTML =
          '<div class="model-header">' +
            '<div class="model-title-group">' +
              '<div class="model-badges">' +
                '<span class="badge">Mô hình ' + st.num + '</span>' +
                '<span class="badge ' + st.tagTone + '">' + st.tag + '</span>' +
              '</div>' +
              '<h2>' + st.title + '</h2>' +
              '<p class="model-subtitle">' + st.subtitle + '</p>' +
            '</div>' +
            (controlsHtml ? '<div class="model-controls">' + controlsHtml + '</div>' : '') +
          '</div>' +
          '<div class="stage-canvas-wrap">' + scene.svgHtml + '</div>' +
          '<div class="status-banner' + bannerCls + '">' +
            '<span>' + scene.banner.text + '</span>' +
            '<strong class="status-metric">' + scene.banner.metric + '</strong>' +
          '</div>' +
          (scene.extraHtml || '') +
          '<div class="model-takeaways">' + takeawaysHtml + '</div>';

        initPackets(scene.tracks);
        renderPagination();
      }

      function renderPagination() {
        const prev = pageIdx > 0 ? STEPS[pageIdx - 1] : null;
        const next = pageIdx < STEPS.length - 1 ? STEPS[pageIdx + 1] : null;
        const pct = Math.round(((pageIdx + 1) / STEPS.length) * 100);

        document.getElementById("progressFill").style.width = pct + "%";
        document.getElementById("btnPrev").disabled = !prev;
        document.getElementById("prevName").textContent = prev ? prev.num + ". " + prev.label : "Đầu danh sách";
        document.getElementById("btnNext").disabled = !next;
        document.getElementById("nextName").textContent = next ? next.num + ". " + next.label : "Hoàn thành " + STEPS.length + " mô hình";
        document.getElementById("pagerCounter").textContent = "KinShield · Trang " + (pageIdx + 1) + " / " + STEPS.length;

        document.getElementById("pagerDots").innerHTML = STEPS.map(function (s, idx) {
          return '<button type="button" class="pager-dot ' + (idx === pageIdx ? "active" : "") + '" data-dot="' + idx + '" title="' + s.num + '. ' + s.label + '"></button>';
        }).join("");
      }

      function goToPage(idx) {
        pageIdx = Math.max(0, Math.min(STEPS.length - 1, idx));
        if (window.history && window.history.replaceState) {
          window.history.replaceState(null, "", "#" + STEPS[pageIdx].num);
        }
        renderSidebar();
        renderStage();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      // Event delegation
      document.getElementById("sideMenu").addEventListener("click", function (e) {
        const btn = e.target.closest(".side-menu-item");
        if (btn) goToPage(Number(btn.getAttribute("data-idx")));
      });
      document.getElementById("modelStage").addEventListener("click", function (e) {
        const btn = e.target.closest(".ctrl-btn");
        if (btn) {
          modeByStep[STEPS[pageIdx].num] = btn.getAttribute("data-mode");
          renderStage();
          return;
        }
        const row = e.target.closest("tr[data-row-mode]");
        if (row) {
          modeByStep[STEPS[pageIdx].num] = row.getAttribute("data-row-mode");
          renderStage();
        }
      });
      document.getElementById("pagerDots").addEventListener("click", function (e) {
        const dot = e.target.closest(".pager-dot");
        if (dot) goToPage(Number(dot.getAttribute("data-dot")));
      });
      document.getElementById("btnPrev").addEventListener("click", function () { goToPage(pageIdx - 1); });
      document.getElementById("btnNext").addEventListener("click", function () { goToPage(pageIdx + 1); });

      document.getElementById("btnPlay").addEventListener("click", function () {
        running = !running;
        this.textContent = running ? "Tạm dừng" : "Chạy tiếp";
        this.classList.toggle("active", running);
      });

      document.querySelectorAll(".speed-btn").forEach(function (b) {
        b.addEventListener("click", function () {
          speed = Number(b.getAttribute("data-speed"));
          document.querySelectorAll(".speed-btn").forEach(function (x) { x.classList.remove("active"); });
          b.classList.add("active");
        });
      });

      document.getElementById("btnTheme").addEventListener("click", function () {
        const isDark = document.documentElement.getAttribute("data-theme") === "dark";
        const next = isDark ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        this.textContent = next === "dark" ? "Sáng dịu" : "Tối dịu";
      });

      window.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight" && pageIdx < STEPS.length - 1) goToPage(pageIdx + 1);
        else if (e.key === "ArrowLeft" && pageIdx > 0) goToPage(pageIdx - 1);
      });

      const initHash = (window.location.hash || "").replace("#", "");
      if (initHash) {
        const foundIdx = STEPS.findIndex(function (s) { return s.num === initHash; });
        if (foundIdx >= 0) pageIdx = foundIdx;
      }
      renderSidebar();
      renderStage();
      rafId = window.requestAnimationFrame(tick);
    })();
  </script>
</body>
