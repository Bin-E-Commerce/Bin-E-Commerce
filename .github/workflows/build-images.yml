name: Build Images

on:
  # Chỉ build sau khi CI của commit main đã pass. Workflow này không tự deploy.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Commit SHA cần build lại (dùng cho emergency/retry)
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: daongocanh25092004

jobs:
  detect:
    name: Detect images to build
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      backend_matrix: ${{ steps.affected.outputs.backend_matrix }}
      has_backend_changes: ${{ steps.affected.outputs.has_backend_changes }}
      release_sha: ${{ steps.context.outputs.release_sha }}
    steps:
      - name: Resolve release commit
        id: context
        shell: bash
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.commit_sha }}
        run: |
          release_sha="${MANUAL_SHA:-$WORKFLOW_RUN_SHA}"
          if [[ -z "$release_sha" ]]; then
            release_sha="${GITHUB_SHA}"
          fi
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout release commit and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.release_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Detect changed services
        id: affected
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.context.outputs.release_sha }}
        run: |
          result="$(node .github/scripts/detect-affected-services.mjs --head "$RELEASE_SHA")"
          echo "backend_matrix=$(node -e 'const x=JSON.parse(process.argv[1]); console.log(JSON.stringify(x.backendMatrix))' "$result")" >> "$GITHUB_OUTPUT"
          echo "has_backend_changes=$(node -e 'console.log(JSON.parse(process.argv[1]).hasBackendChanges)' "$result")" >> "$GITHUB_OUTPUT"
          echo "$result" | node -e 'let s=""; process.stdin.on("data", c => s += c).on("end", () => { const x=JSON.parse(s); console.log(`Images: ${x.deployServices.join(", ") || "none"}`); })'

  build:
    name: Build and scan ${{ matrix.name }}
    needs: detect
    # Điều kiện chỉ dùng output của detect. Không dùng matrix ở jobs.if vì
    # GitHub đánh giá jobs.if trước khi mở rộng strategy.matrix.
    if: needs.detect.outputs.has_backend_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.backend_matrix) }}
    steps:
      - name: Checkout release commit and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.release_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN là mặc định ít quyền nhất cho package của repository;
          # GHCR_TOKEN chỉ cần khi tổ chức bắt buộc dùng PAT riêng.
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/bin-ecommerce-${{ matrix.name }}:${{ needs.detect.outputs.release_sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: mode=max
          sbom: true

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/bin-ecommerce-${{ matrix.name }}:${{ needs.detect.outputs.release_sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate and archive SBOM
        uses: anchore/sbom-action@v0.17.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/bin-ecommerce-${{ matrix.name }}:${{ needs.detect.outputs.release_sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.name }}.spdx.json
          artifact-name: sbom-${{ matrix.name }}
          upload-artifact: true

      - name: Write release image record
        shell: bash
        env:
          SERVICE: ${{ matrix.name }}
          RELEASE_SHA: ${{ needs.detect.outputs.release_sha }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p release-records
          jq -n \
            --arg service "$SERVICE" \
            --arg image "${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/bin-ecommerce-${{ matrix.name }}:$RELEASE_SHA" \
            --arg digest "$DIGEST" \
            '{service: $service, image: $image, digest: $digest}' \
            > "release-records/${SERVICE}.json"

      - name: Upload per-service release record
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release-records/${{ matrix.name }}.json
          if-no-files-found: error

  release-manifest:
    name: Publish release manifest
    needs: [detect, build]
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Download image records
        if: needs.detect.outputs.has_backend_changes == 'true' && needs.build.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-records
          merge-multiple: true

      - name: Generate release manifest
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.detect.outputs.release_sha }}
        run: |
          shopt -s nullglob
          files=(release-records/*.json)
          if (( ${#files[@]} == 0 )); then
            records='[]'
          else
            records="$(jq -s '.' "${files[@]}")"
          fi
          jq -n \
            --arg commit "$RELEASE_SHA" \
            --arg generated_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson images "$records" \
            '{commit: $commit, generatedAt: $generated_at, frontend: "vercel", images: $images}' \
            > release-manifest.json
          cat release-manifest.json

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ needs.detect.outputs.release_sha }}
          path: release-manifest.json
          if-no-files-found: error
