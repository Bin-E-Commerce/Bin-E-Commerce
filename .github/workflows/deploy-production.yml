name: Deploy Production

on:
  # Build Images chỉ phát hành khi CI đã pass; deploy nhận đúng SHA của run đó.
  workflow_run:
    workflows: [Build Images]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA cần deploy lại
        required: true
        type: string

permissions:
  contents: read
  # OIDC cho phép đổi token GitHub ngắn hạn lấy AWS STS credentials.
  id-token: write

env:
  PROD_NAMESPACE: bin-ecommerce-app

jobs:
  detect:
    name: Prepare production release
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.context.outputs.release_sha }}
      deploy_services: ${{ steps.affected.outputs.deploy_services }}
    steps:
      - name: Resolve release commit
        id: context
        shell: bash
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_SHA: ${{ inputs.release_sha }}
        run: |
          release_sha="${MANUAL_SHA:-$WORKFLOW_RUN_SHA}"
          if [[ -z "$release_sha" ]]; then
            release_sha="${GITHUB_SHA}"
          fi
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'release_sha must be a full lowercase Git SHA.'
            exit 1
          fi
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout release commit and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.context.outputs.release_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Detect backend images in this release
        id: affected
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.context.outputs.release_sha }}
        run: |
          result="$(node .github/scripts/detect-affected-services.mjs --head "$RELEASE_SHA")"
          services="$(node -e 'console.log(JSON.parse(process.argv[1]).deployServices.join(","))' "$result")"
          echo "deploy_services=$services" >> "$GITHUB_OUTPUT"
          echo "Services scheduled for production: ${services:-none}"

  deploy:
    name: Deploy approved release to K3s
    needs: detect
    if: needs.detect.outputs.deploy_services != ''
    runs-on: ubuntu-latest
    # Tạo Repository Variable PRODUCTION_ENVIRONMENT=production. Dùng vars
    # giúp Environment name được cấu hình ngoài workflow và tránh IntelliSense
    # của VS Code đánh dấu giá trị production tĩnh là invalid.
    environment: ${{ vars.PRODUCTION_ENVIRONMENT }}
    env:
      RELEASE_SHA: ${{ needs.detect.outputs.release_sha }}
      CHANGED_SERVICES: ${{ needs.detect.outputs.deploy_services }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      PROD_INSTANCE_ID: ${{ vars.PROD_INSTANCE_ID }}
      PROD_MANIFEST_PATH: ${{ vars.PROD_K3S_MANIFEST_PATH }}
    steps:
      - name: Checkout release commit and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.release_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify required production configuration
        shell: bash
        run: |
          test -n "$AWS_REGION" || { echo 'Missing AWS_REGION.'; exit 1; }
          test -n "$AWS_DEPLOY_ROLE_ARN" || { echo 'Missing AWS_DEPLOY_ROLE_ARN.'; exit 1; }
          test -n "$PROD_INSTANCE_ID" || { echo 'Missing PROD_INSTANCE_ID.'; exit 1; }
          test -n "$PROD_MANIFEST_PATH" || { echo 'Missing production manifest path.'; exit 1; }

      - name: Create non-secret release environment file
        shell: bash
        run: |
          {
            printf 'RELEASE_SHA=%s\n' "$RELEASE_SHA"
            printf 'CHANGED_SERVICES=%s\n' "$CHANGED_SERVICES"
            IFS=',' read -r -a services <<< "$CHANGED_SERVICES"
            for service in "${services[@]}"; do
              variable="IMAGE_${service//-/_}"
              printf '%s=%s\n' "$variable" \
                "ghcr.io/daongocanh25092004/bin-ecommerce-${service}:${RELEASE_SHA}"
            done
          } > release.env

          # Chỉ chứa image reference và SHA; không đưa SSH key, database
          # password, OAuth secret hay Kubernetes runtime Secret vào file này.
          chmod 600 release.env

      # OIDC cấp credential AWS ngắn hạn sau khi Environment production được approve.
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify production node is online in SSM
        shell: bash
        run: |
          ping_status="$(aws ssm describe-instance-information \
            --region "$AWS_REGION" \
            --filters "Key=InstanceIds,Values=$PROD_INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)"

          test "$ping_status" = "Online" || {
            echo "Production instance is not Online in SSM: $ping_status"
            exit 1
          }

      # SSM nhận script và release metadata qua base64 để không lỗi quoting JSON.
      - name: Deploy services through SSM
        id: ssm-deploy
        shell: bash
        run: |
          set -Eeuo pipefail

          script_b64="$(base64 --wrap=0 scripts/deploy-production.sh)"
          release_b64="$(base64 --wrap=0 release.env)"
          namespace_b64="$(printf '%s' "$PROD_NAMESPACE" | base64 --wrap=0)"
          manifest_b64="$(printf '%s' "$PROD_MANIFEST_PATH" | base64 --wrap=0)"

          commands_json="$(jq -cn \
            --arg script "$script_b64" \
            --arg release "$release_b64" \
            --arg namespace "$namespace_b64" \
            --arg manifest "$manifest_b64" \
            '{
              commands: [
                "set -eu",
                "trap \"sudo rm -f /tmp/bin-ecommerce-release.env /tmp/bin-ecommerce-deploy-production.sh\" EXIT",
                ("printf %s " + $script + " | base64 -d | sudo tee /tmp/bin-ecommerce-deploy-production.sh >/dev/null"),
                ("printf %s " + $release + " | base64 -d | sudo tee /tmp/bin-ecommerce-release.env >/dev/null"),
                "sudo chmod 0755 /tmp/bin-ecommerce-deploy-production.sh",
                "sudo chmod 0600 /tmp/bin-ecommerce-release.env",
                "sudo install -m 0755 /tmp/bin-ecommerce-deploy-production.sh /opt/bin-ecommerce/deploy-production.sh",
                ("sudo env RELEASE_ENV_FILE=/tmp/bin-ecommerce-release.env NAMESPACE=\"$(printf %s " + $namespace + " | base64 -d)\" K3S_MANIFEST_PATH=\"$(printf %s " + $manifest + " | base64 -d)\" bash /opt/bin-ecommerce/deploy-production.sh")
              ]
            }')"

          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name AWS-RunShellScript \
            --instance-ids "$PROD_INSTANCE_ID" \
            --comment "Bin E-Commerce production deploy $RELEASE_SHA" \
            --parameters "$commands_json" \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command submitted: $command_id"

          for attempt in $(seq 1 72); do
            status="$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$PROD_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$command_id" \
                  --instance-id "$PROD_INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                echo "SSM deploy failed with status: $status" >&2
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$command_id" \
                  --instance-id "$PROD_INSTANCE_ID" \
                  --query '{stdout:StandardOutputContent,stderr:StandardErrorContent}' \
                  --output json
                exit 1
                ;;
              *)
                echo "SSM status: $status (attempt $attempt/72)"
                sleep 5
                ;;
            esac
          done

          echo 'SSM deploy timed out after 6 minutes.' >&2
          exit 1

      - name: Remove temporary release metadata
        if: always()
        shell: bash
        run: |
          rm -f release.env
